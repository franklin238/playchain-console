<ellipse cx="258" cy="322" rx="104" ry="20" fill="#000" opacity=".6" filter="url(#bsoft)"/>
<path d="M188 104 L188 312 L372 208 Z" fill="#c8ff4d" opacity=".45" filter="url(#bblur)" stroke="#c8ff4d" stroke-width="40" stroke-linejoin="round"/>
<path d="M188 104 L188 312 L372 208 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="40" stroke-linejoin="round"/>
<rect width="512" height="512" fill="url(#bgloss)" mask="url(#bm)"/>
</svg>