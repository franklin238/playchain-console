<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hollow Kingdom</title>
<link rel="icon" href="data:,">
<style>
:root{
  --sky-top:#2C343B;--sky-bot:#14181C;--stone:#121214;--hills:#22272B;--moon:#DCD8CA;
  --gold:#D6A94A;--maroon:#5A1E2A;--violet:#6E5A8C;--ts:1;
  --panel:rgba(20,24,28,.92);--line:rgba(220,216,202,.14);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,"Times New Roman",serif;
}
html{font-size:calc(15px * var(--ts))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#14181C;color:var(--moon);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c.drag{cursor:grabbing}
canvas#c.target{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(44,52,59,.85);border-radius:.5rem;padding:.45rem .8rem;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){border-color:rgba(214,169,74,.6);background:rgba(60,64,66,.9)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:700}
button.primary:hover:not(:disabled){background:#e4b95a}
button.danger{border-color:rgba(160,60,75,.6)}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;padding:.55rem .7rem;pointer-events:none;background:linear-gradient(rgba(20,24,28,.85),rgba(20,24,28,0))}
#topbar > *{pointer-events:auto}
#res{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:center;max-width:44%}
.r{display:flex;align-items:center;gap:.3rem;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;padding:.15rem .1rem;border-radius:.4rem;transition:transform .15s,color .15s}
.r svg{width:1.2rem;height:1.2rem;flex:none}
.r.bump{transform:scale(1.25);color:#fff}
.r.short{color:#e07a6a}
.r small{font-weight:500;opacity:.6;font-size:.75rem}
#clock{display:flex;align-items:center;gap:.6rem;background:rgba(20,24,28,.7);border:1px solid var(--line);border-radius:2rem;padding:.25rem .6rem .25rem .3rem}
#dial{width:2.4rem;height:2.4rem}
#clockText b{display:block;font-family:var(--serif);font-size:1.05rem;letter-spacing:.02em}
#clockText span{font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#speed{display:flex;gap:.2rem}
#speed button{padding:.2rem .45rem;font-size:.8rem;border-radius:1rem;min-width:2rem}
#speed button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
#tr{display:flex;gap:.35rem}
#tr button{padding:.4rem .7rem}
#goal{position:absolute;top:3.6rem;left:.7rem;background:var(--panel);border:1px solid rgba(214,169,74,.35);border-radius:.6rem;padding:.5rem .7rem;min-width:13rem;max-width:17rem;cursor:pointer}
#goal h4{margin:0 0 .3rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}
#goal .gn{font-family:var(--serif);font-size:1.1rem;margin-bottom:.3rem}
.bar{height:.36rem;background:rgba(255,255,255,.08);border-radius:1rem;overflow:hidden;margin:.18rem 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:1rem;transition:width .3s}
.costrow{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-variant-numeric:tabular-nums}
.costrow svg{width:.95rem;height:.95rem;flex:none}
.costrow .bar{flex:1}
.costrow.ok{color:#cfd9b0}
#preview{position:absolute;top:3.6rem;right:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.45rem .7rem;font-size:.8rem;max-width:15rem}
#preview b{color:#b9a6d9}
#preview.blood{border-color:#8c2c3c}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:.6rem;pointer-events:none;background:linear-gradient(rgba(20,24,28,0),rgba(20,24,28,.8))}
#bottom > *{pointer-events:auto}
#jobs,#powers{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;align-items:stretch}
.job{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:5.6rem}
.job .jn{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;display:flex;gap:.3rem;align-items:center}
.job .jn svg{width:.9rem;height:.9rem}
.job .jc{display:flex;align-items:center;gap:.35rem}
.job .jc b{font-size:1.15rem;min-width:1.4rem;text-align:center;font-variant-numeric:tabular-nums}
.job .jc button{padding:.1rem .5rem;font-weight:700;border-radius:.4rem}
.job.idle{justify-content:center;opacity:.85}
.job .side{display:flex;gap:.25rem;font-size:.72rem;align-items:center}
.job .side button{padding:0 .35rem;font-size:.75rem}
.pw{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .7rem;min-width:5.8rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;overflow:hidden}
.pw .k{position:absolute;top:.2rem;left:.35rem;font-size:.65rem;opacity:.5}
.pw .pn{font-family:var(--serif);font-size:1rem}
.pw .pc{font-size:.72rem;opacity:.8;display:flex;align-items:center;gap:.2rem}
.pw .pc svg{width:.8rem;height:.8rem}
.pw .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.pw.locked{opacity:.35}
.pw.armed{border-color:var(--gold);box-shadow:0 0 0 2px rgba(214,169,74,.4)}
#guardsBox{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;gap:.2rem}
#guardsBox .side{display:flex;gap:.3rem;align-items:center}
#guardsBox button{padding:0 .4rem}
#walls{display:flex;gap:.6rem;font-size:.7rem;opacity:.85}
#walls .bar{width:3.5rem}
#walls .bar i{background:#9aa3a8}

/* side panel */
#panel{position:absolute;right:.7rem;top:7.2rem;max-height:calc(100% - 15rem);width:21rem;max-width:calc(100% - 1.4rem);background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.9rem 1rem;overflow:auto;backdrop-filter:blur(4px)}
#panel h2{font-family:var(--serif);font-weight:400;margin:0 0 .2rem;font-size:1.5rem;color:#f0e6cc}
#panel .x{position:absolute;top:.5rem;right:.5rem;padding:.1rem .5rem}
#panel .st{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.6rem}
#panel .st.lit{color:var(--gold)}#panel .st.dark{opacity:.6}#panel .st.building{color:#c9a27a}
#panel p{margin:.4rem 0;font-size:.88rem;line-height:1.45}
#panel .lore{font-family:var(--serif);font-style:italic;color:#e8d9b0;border-left:2px solid var(--gold);padding-left:.6rem}
#panel .req{font-size:.8rem;opacity:.85}
#panel .req .no{color:#e07a6a}
#panel .btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.hl-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.4rem}
.hrow{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:.5rem;cursor:pointer;background:rgba(255,255,255,.02)}
.hrow:hover{border-color:rgba(214,169,74,.5)}
.hrow .dot{width:.7rem;height:.7rem;border-radius:2px;background:#2a2b2e;flex:none;border:1px solid #444}
.hrow .dot.lit{background:var(--gold);box-shadow:0 0 6px var(--gold);border-color:var(--gold)}
.hrow .dot.building{background:#8a6a3a}
.hrow .nm{font-family:var(--serif);flex:1}
.hrow .dep{font-size:.7rem;opacity:.6}

#toasts{position:absolute;top:4.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;width:min(36rem,90%)}
.toast{background:rgba(20,24,28,.9);border:1px solid rgba(214,169,74,.4);border-radius:.6rem;padding:.55rem 1rem;font-size:.9rem;text-align:center;animation:tin .4s ease-out;transition:opacity .8s}
.toast.lore{font-family:var(--serif);font-style:italic;font-size:1rem;color:#f0e2bc}
.toast.bad{border-color:#8c2c3c}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:var(--serif);font-size:3rem;color:#f0e6cc;text-shadow:0 0 30px rgba(0,0,0,.8);opacity:0;transition:opacity 1s}
#banner small{display:block;font-size:1rem;font-family:var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:.4rem}
#banner.show{opacity:1}
#banner.blood{color:#e5a0a8}

#tip{position:fixed;z-index:30;max-width:17rem;background:#f2e6c4;color:#1b1408;border-radius:.6rem;padding:.65rem .8rem;font-size:.88rem;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:auto}
#tip b{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:.2rem}
#tip button{margin-top:.45rem;padding:.15rem .5rem;font-size:.72rem;background:transparent;color:#1b1408;border-color:rgba(0,0,0,.25)}
#tip:after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#f2e6c4;transform:translateX(-50%) rotate(45deg)}
#tip.below:after{top:-6px}#tip.above:after{bottom:-6px}
.hl{box-shadow:0 0 0 2px var(--gold),0 0 18px 4px rgba(214,169,74,.55)!important;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 8px 1px rgba(214,169,74,.3)}}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#title{justify-content:flex-end;padding-bottom:7vh;background:linear-gradient(rgba(20,24,28,0) 55%,rgba(17,18,20,.9) 80%)}
#title h1{font-family:var(--ui);font-weight:800;font-size:clamp(2.4rem,7vw,4.6rem);margin:0;color:#fff;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#title .tag{margin:.4rem 0 .2rem;font-size:1.05rem;color:#cfcac0}
#title .line{font-family:var(--serif);font-style:italic;color:var(--gold);margin:.3rem 0 1.3rem;font-size:1.05rem;opacity:.9}
#title .menu{display:flex;flex-direction:column;gap:.5rem;min-width:15rem}
#title .menu button{padding:.7rem 1rem;font-size:1rem}
#title .reign{font-size:.75rem;opacity:.6;margin-top:.8rem;letter-spacing:.1em;text-transform:uppercase}
#title .credit{position:absolute;bottom:.6rem;right:.8rem;font-size:.7rem;opacity:.4}
#modal{background:rgba(10,12,14,.55);backdrop-filter:blur(3px)}
.card{background:#181c20;border:1px solid var(--line);border-radius:1rem;padding:1.4rem 1.6rem;min-width:18rem;max-width:min(30rem,92vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h2{font-family:var(--serif);font-weight:400;font-size:1.8rem;margin:0 0 .3rem;color:#f0e6cc}
.card h3{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 .8rem}
.card .menu{display:flex;flex-direction:column;gap:.45rem;margin-top:1rem}
.card .menu button{padding:.6rem 1rem}
.card table{width:100%;border-collapse:collapse;font-size:.9rem;margin:.4rem 0}
.card td{padding:.32rem 0;border-bottom:1px solid var(--line)}
.card td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.card td.bad{color:#e07a6a}.card td.good{color:#cfd9b0}
.card.wide{max-width:min(42rem,94vw)}
.card p{font-size:.9rem;line-height:1.5;opacity:.9}
.medalwrap{max-height:58vh;overflow-y:auto;padding-right:.3rem}
.medalwrap h4{margin:.8rem 0 .4rem}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.45rem}
.mcell{display:grid;grid-template-columns:3.4rem 1fr;gap:.55rem;align-items:center;border:1px solid var(--line);border-radius:.6rem;padding:.4rem .55rem;font-size:.78rem;line-height:1.25}
.mcell.on{border-color:rgba(214,169,74,.55);background:rgba(214,169,74,.06)}
.mcell.on.legend{border-color:rgba(255,122,154,.7);background:linear-gradient(135deg,rgba(255,215,106,.08),rgba(154,122,255,.1))}
.mcell b{display:block;font-size:.86rem}
.mcell small.tier{display:block;opacity:.6;text-transform:uppercase;letter-spacing:.1em;font-size:.6rem}
.mcell .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin:.25rem 0 .1rem;overflow:hidden}
.mcell .bar i{display:block;height:100%;background:var(--gold)}
.mcell .prog{opacity:.6;font-size:.68rem}
.mcell .got{display:block;color:var(--gold);font-size:.7rem;margin-top:.15rem}
svg.medal{width:3.3rem;height:3.3rem}
svg.medal.off{filter:grayscale(1) brightness(.55);opacity:.55}
.medalpop{position:fixed;left:50%;top:5.2rem;transform:translateX(-50%);display:flex;gap:.7rem;align-items:center;background:rgba(18,16,14,.96);border:1px solid rgba(214,169,74,.7);border-radius:.8rem;padding:.55rem .9rem;z-index:60;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:mpIn .35s ease-out}
.medalpop.legend{border-color:#ff8a9a;box-shadow:0 0 40px rgba(255,122,154,.35)}
.medalpop.out{opacity:0;transition:opacity .45s}
.medalpop svg{width:3.4rem;height:3.4rem;flex:none}
.medalpop small{display:block;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:.62rem}
.medalpop b{display:block;font-family:var(--serif);font-size:1.05rem}
.medalpop span{font-size:.78rem;opacity:.8}
@keyframes mpIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.ending p{font-family:var(--serif);font-size:1rem;line-height:1.55}
.klist{display:grid;gap:.5rem;margin-top:.6rem;max-height:58vh;overflow-y:auto;padding-right:.3rem}
.kitem{text-align:left;display:block;width:100%;padding:.7rem .9rem;border-radius:.7rem;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.kitem:not(:disabled):hover,.kitem:not(:disabled):focus-visible{border-color:var(--gold)}
.kitem:disabled{opacity:.45}
.kitem b{font-family:var(--serif);font-weight:400;font-size:1.15rem;color:#f0e6cc}
.kitem .kc{float:right;letter-spacing:.1em;color:var(--gold)}
.kitem small{display:block;opacity:.75;font-size:.8rem;margin-top:.15rem;line-height:1.4}
.crowns{font-size:2rem;letter-spacing:.3rem;color:var(--gold);margin:.3rem 0}
.crowns .off{opacity:.25}
.quest{font-size:.74rem;margin-top:.45rem;padding-top:.35rem;border-top:1px solid rgba(214,169,74,.2);line-height:1.3}
.quest b{color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:.66rem;margin-right:.25rem}
.quest small{opacity:.7}
.quest.ok{color:#a8d890}
.arm{display:grid;gap:.5rem;margin:.6rem 0}
.arm .wp{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;align-items:center;border:1px solid var(--line);border-radius:.6rem;padding:.5rem .7rem}
.arm .wp.own{border-color:rgba(214,169,74,.6);background:rgba(214,169,74,.08)}
.arm .wp small{grid-column:1/-1;opacity:.75}
.arm .wp .cost{display:flex;gap:.5rem;font-size:.8rem;align-items:center}
.arm .wp .cost svg{width:.9rem;height:.9rem;vertical-align:-.15rem}
.kobj{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:-.1rem 0 .4rem;padding-bottom:.35rem;border-bottom:1px solid rgba(214,169,74,.2)}
.howto h4{margin:1.1rem 0 .4rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.howto table td{font-weight:400;text-align:left;vertical-align:top;padding-right:.6rem;font-size:.85rem}
.howto table td:first-child{white-space:nowrap;font-weight:700;color:#f0e6cc}
.howto ul{padding-left:1.1rem;margin:.3rem 0;font-size:.88rem;line-height:1.5}
.set{display:grid;grid-template-columns:7rem 1fr 2.5rem;align-items:center;gap:.5rem;margin:.45rem 0;font-size:.9rem}
.set input[type=range]{width:100%;accent-color:var(--gold)}
.seg{display:flex;gap:.3rem}
.seg button{padding:.25rem .6rem;font-size:.82rem}
.seg button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
#cursor{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--gold);border-radius:50%;pointer-events:none;z-index:50;box-shadow:0 0 10px rgba(214,169,74,.6)}
#cursor:after{content:"";position:absolute;left:8px;top:8px;width:2px;height:2px;background:var(--gold)}
@media (max-width:720px){
  #res{max-width:58%;gap:.2rem .5rem}
  .r{font-size:.85rem}
  #clock{padding:.15rem .4rem .15rem .2rem;gap:.35rem}
  #dial{width:1.9rem;height:1.9rem}
  #speed button{min-width:1.6rem;padding:.15rem .3rem}
  #clockText span{display:none}
  #goal{top:auto;bottom:9.5rem;min-width:0;max-width:11rem;padding:.4rem .5rem}
  #goal .costrow span{display:none}
  #preview{display:none}
  #topbar{flex-wrap:wrap}
  #panel{top:auto;bottom:8.6rem;max-height:46vh;width:auto;left:.7rem}
  .job{min-width:4.2rem;padding:.25rem .3rem}
  .pw{min-width:4.4rem;padding:.3rem .4rem}
  #banner{font-size:2rem}
}
@media (max-width:420px){ #tr button{padding:.3rem .45rem} #clock{order:3} }
/* Phones held sideways (short screens): the whole interface at about 70% of its desktop size, so
   the castle stays in view and every panel still fits. The tutorial bubble is placed by script, so
   it is made smaller rather than zoomed. */
@media (max-height:500px){
  #hud{zoom:.7}
  #title,#modal{zoom:.8}
  #tip{max-width:13rem;font-size:.74rem;padding:.45rem .6rem}
  #banner{font-size:1.8rem}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="res"></div>
    <div id="clock">
      <svg id="dial" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="rgba(0,0,0,.35)" stroke="rgba(220,216,202,.2)" stroke-width="2"/><circle id="dialArc" cx="20" cy="20" r="17" fill="none" stroke="#D6A94A" stroke-width="3" stroke-dasharray="106.8" stroke-dashoffset="0" transform="rotate(-90 20 20)" stroke-linecap="round"/><g id="dialIcon"></g></svg>
      <div id="clockText"><b id="dayLabel">Day 1</b><span id="timeLeft">2:30</span></div>
      <div id="speed"><button data-s="0" title="Pause (Space)">II</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="3">3x</button></div>
    </div>
    <div id="tr"><button id="btnArmory" title="Armory (A)">Armory</button><button id="btnHalls" title="Halls (H)">Halls</button><button id="btnMenu" title="Menu (Esc)">&#9776;</button></div>
  </div>
  <div id="goal"></div>
  <div id="preview"></div>
  <div id="bottom"><div id="jobs"></div><div id="powers" class="hidden"></div></div>
  <div id="panel" class="hidden"></div>
  <div id="toasts"></div>
</div>
<div id="banner"></div>
<div id="tip" class="hidden"></div>

<div id="title" class="screen">
  <h1>Hollow Kingdom</h1>
  <div class="tag">Rebuild a kingdom one empty hall at a time.</div>
  <div class="line">The halls remember. Light them again.</div>
  <div class="menu">
    <button id="tContinue" class="primary hidden">Continue</button>
    <button id="tNew">Kingdoms</button>
    <button id="tMedals">Medals</button>
    <button id="tHow">How to Play</button>
    <button id="tSettings">Settings</button>
  </div>
  <div class="reign" id="tReign"></div>
  <div class="credit">A PlayChain game by Steeve</div>
</div>
<div id="modal" class="screen hidden"><div class="card" id="mcard"></div></div>
<div id="cursor" class="hidden"></div>
<script>
'use strict';
/* =====================================================================
   CONTENT: every balance number, hall, enemy and lore line lives here.
   Tune freely. Costs: st=stone tb=timber gr=grain em=ember co=coin.
   ===================================================================== */
const CONTENT = {
  version: 1,
  timing: { dayLen: 150, nightLen: 100, bellAt: 30, duskWalkHome: 9, nightFade: 3 },
  start: { villagers: 5, res: { stone: 6, timber: 4, grain: 14, ember: 5, coin: 4, iron: 2 }, wallHp: 160 },
  economy: {
    gatherPerSec: { quarry: 0.29, wood: 0.3, fields: 0.14, mine: 0.11 },   // mining is slow work
    loadSize: 3,                     // units carried per floating number

function rngNext(G) { // mulberry32 with state kept in save
  let t = (G.rng = (G.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

    <div class="menu"><button class="primary" id="eStay">Keep defending (Endless Nights)</button><button id="eMedals">Hall of Medals</button><button id="eList">Kingdoms</button>${inFrame ? '<button id="eVote">Back to PlayChain</button>' : ''}</div>`, 'ending');
  $('mcard').classList.add('wide');

const kUnlocked = i => i === 0 || (campaign.crowns[KINGDOMS[i - 1].id] || 0) > 0;

    KINGDOMS.map((k, i) => { const ok = kUnlocked(i), c = campaign.crowns[k.id] || 0, cur = G && G.kingdom === k.id && !G.done;
      return `<button class="kitem" data-k="${k.id}" ${ok ? '' : 'disabled'}><span class="kc">${crownStr(c)}</span><b>${i + 1}. ${k.name}</b><small>${ok ? k.place + '. ' + k.twist : 'Restore ' + KINGDOMS[i - 1].name + ' to unlock.'}</small><small>${ok ? `Goal: every hall, ${k.goal.nights} nights${cur ? ' &middot; <b style="font-size:.8rem;color:var(--gold)">in progress, day ' + G.day + '</b>' : ''}` : ''}</small></button>`; }).join('') +
    `</div><div class="menu"><button id="kBack">Back</button></div>`, 'kingdoms');

}
function afterReport() {

  if (G.event) showEvent();
}
function showKingdomEnd(kind) {
  const K = KINGDOM[G.kingdom] || KINGDOMS[0], i = KINGDOMS.indexOf(K), next = KINGDOMS[i + 1];
  G.done = true;
  if (kind === 'won') {
    const c = crownsFor(G), prev = campaign.crowns[K.id] || 0;
    campaign.crowns[K.id] = Math.max(prev, c);
    stat('wins'); if (G.day <= 12) statMax('fast12', 1);
    if (K.n >= 6 && G.day <= 13) statMax('swift', 1);
    if (K.n >= 6 && !G.usedPower && !G.hired) statMax('ironWill', 1);
    if (K.id === 'hollowthrone' && c === 3) statMax('throne3', 1);
    save(); checkMedals();

    Audio.sfx('crown');

      <tr><td>No villager lost (${G.kst.lost} lost)</td><td class="${G.kst.lost ? 'bad' : 'good'}">${G.kst.lost ? '-' : '\u265B'}</td></tr></table>
      <p>${G.nightsSurvived} nights, ${restoredCount(G)} halls restored.${c > prev && prev ? ' New best!' : ''}</p>
      <div class="menu">${next ? `<button class="primary" id="kNext">Ride to ${next.name}</button>` : '<p style="color:var(--gold)">Every kingdom is restored. The Hollow have nowhere left to go.</p>'}<button id="kStay" ${next ? '' : 'class="primary"'}>Keep defending (Endless Nights)</button><button id="kList">Kingdoms</button>${inFrame ? '<button id="kVote">Back to PlayChain to vote</button>' : ''}</div>`, 'kend');
    if ($('kNext')) $('kNext').onclick = () => { Audio.sfx('select'); closeModal(); startKingdom(next.id); };
  } else {
    Audio.sfx('defeat');

    $('kRetry').onclick = () => { Audio.sfx('select'); closeModal(); startKingdom(K.id); };
  }
  if ($('kStay')) $('kStay').onclick = () => { Audio.sfx('select'); G.endless = true; save(); closeModal(); if (G.event) showEvent(); };
  $('kList').onclick = () => { Audio.sfx('select'); openKingdoms(() => showKingdomEnd(kind)); };
  if ($('kVote')) $('kVote').onclick = () => { save(); post({ type: 'playchain:exit' }); };
  post({ type: 'playchain:score', score: score(G) });
}
function openArmory() {
  const C = CONTENT, own = G.weapons || {};
  const row = w => { const has = own[w.id], unl = lit(G, w.hall), ok = canAfford(G, w.cost);
    return `<div class="wp ${has ? 'own' : ''}"><b>${w.name}</b>${has ? '<span style="color:var(--gold)">Owned</span>' : `<button data-w="${w.id}" ${unl && ok ? 'class="primary"' : 'disabled'}>Buy</button>`}<small>${w.desc}${unl ? '' : ` Needs the ${HALL[w.hall].name}.`}</small>${has ? '' : `<span class="cost">${Object.keys(w.cost).map(k => `${ICON[CKEY[k]]} ${Math.floor(G.res[CKEY[k]])}/${w.cost[k]}`).join(' ')}</span>`}</div>`; };
  openModal(`<h3>Iron and coin</h3><h2>Armory</h2><p>Weapons last for the whole kingdom. Miners dig the iron at the mine east of the walls.</p><div class="arm">${C.weapons.map(row).join('')}</div><div class="menu"><button id="aBack">Close</button></div>`, 'armory');
  $('mcard').querySelectorAll('button[data-w]').forEach(b => b.onclick = () => {
    if (buyWeapon(G, b.dataset.w)) { Audio.sfx('rally'); toast(C.weapons.find(w => w.id === b.dataset.w).name + ' forged.', 'good'); save(); updateHUD(true); openArmory(); } else Audio.sfx('deny');
  });

}
function showEvent() {

    ev.choices.map((c, i) => { const ok = !c.ok || c.ok(G); return `<button data-i="${i}" ${i === 0 && ok ? 'class="primary"' : ''} ${ok ? '' : 'disabled title="You cannot afford this"'}>${c.label}</button>`; }).join('') + `</div>`, 'event');

/* ---------- how to play (built from CONTENT so numbers stay true) ---------- */
const BEAT = {
  wisp: 'Fast and frail. Any guard or tower cuts them down; Flare reveals and slows a swarm.',
  husk: 'Slow and tough, pounds the gate. Stack guards on that wall, restore the Forge, and finish groups with Light.',
  thief: 'Picks the gate lock, steals resources and runs. Kill it on the way out to get the loot back. The Vault halves theft.',
  climber: 'Scales the wall to fight your guards. Keep two or more guards per wall; the Infirmary saves the fallen.',
  wailer: 'Hangs back and halves your guards\u2019 damage nearby. Barracks archers outrange it; Light reaches it.',
  knight: 'Blood Moon boss. Huge health, smashes towers first. Save ember for Light and Rally, and Mend the wall it hits.',
  brute: 'A hulking ogre with a club. Very tough and hits hard. Soldiers hold it, Ballista Towers triple their damage on it.',
  bat: 'Flies straight over soldiers and onto the wall to bite your guards. Archers and towers pick them off.',
  burster: 'A glowing sack that explodes at the gate or among your soldiers. Kill it early, before it gets close.',
  shaman: 'Stays back and heals the Hollow around it. Guards aim for it first; Light and Flare reach it.'

function openHowTo(back) {
  const C = CONTENT, cost = h => Object.keys(h.cost).map(k => h.cost[k] + ' ' + CKEY[k]).join(', ') || 'free';
  const K = KINGDOMS.map(k => `<tr><td>${k.name}</td><td>${k.twist} Goal: every hall, ${k.goal.nights} nights.</td></tr>`).join('');
  openModal(`<h3>Guide</h3><h2>How to play</h2><div class="howto">
    <p>Each kingdom is a castle gone dark. By <b>day</b>, send villagers to work and restore halls. By <b>night</b>, the Hollow attack your two walls. Restore every hall and survive the kingdom's nights to win it and unlock the next. There are ${KINGDOMS.length} kingdoms, each harder than the last.</p>
    <h4>Day and night</h4><ul><li>A day lasts ${C.timing.dayLen / 60 | 0}:${String(C.timing.dayLen % 60).padStart(2, '0')}. The bell rings ${C.timing.bellAt} seconds before dusk: put guards on the walls.</li><li>Nights last up to ${C.timing.nightLen} seconds, in ${C.night.waves.length} waves. A banner warns you before each wave and red markers show where Hollow are off screen. They come at both walls from the very first night.</li><li>Every ${C.night.bloodEvery}th night (sooner in Ashfall) a Blood Moon brings the Hollow Knight, and a big reward at dawn.</li><li>At dawn: walls mend a little, villagers eat grain, you collect taxes, and sometimes an event asks you to choose.</li></ul>
    <h4>Resources</h4><table>
    <tr><td>Stone</td><td>From the quarry. Restores halls; guards on the walls use it to repair by day.</td></tr>

    <tr><td>Grain</td><td>From the fields. Each villager eats ${C.economy.upkeepPerVillager} per dawn (half with the Kitchen). Short on grain: hungry villagers work at ${C.economy.hungryWorkMult * 100}% speed.</td></tr>
    <tr><td>Ember</td><td>Dropped by the Hollow, +${C.rewards.baseEmber} each dawn, more with the Chapel. Pays for powers and some halls.</td></tr>
    <tr><td>Iron</td><td>Dug slowly at the iron mine east of the walls. Late halls need it, and so does every weapon in the Armory.</td></tr>
    <tr><td>Coin</td><td>${C.economy.taxPerVillager} per villager each dawn, more with the Market. Hires sellswords and pays for late halls.</td></tr></table>
    <h4>Jobs</h4><table>
    <tr><td>Quarry, Woodcutter, Mine, Fields</td><td>Gather stone, timber, iron and grain. Mining is the slowest work.</td></tr>
    <tr><td>Build</td><td>Works on the hall being restored. More builders, faster halls.</td></tr>
    <tr><td>Walls</td><td>Guards. They repair by day and fight at night. Use the left and right buttons to choose the wall.</td></tr>
    <tr><td>Soldiers</td><td>Stand on the ground outside a gate with sword and shield (${C.soldiers.hp} health). Walking Hollow must cut through them before they reach the wall. Bats fly over them, and Shamans and Wailers stay back.</td></tr></table>
    <h4>Armory</h4><table>${C.weapons.map(w => `<tr><td>${w.name}</td><td>${w.desc} <span style="opacity:.6">(${Object.keys(w.cost).map(k => w.cost[k] + ' ' + CKEY[k]).join(', ')}; needs the ${HALL[w.hall].name})</span></td></tr>`).join('')}</table>
    <h4>Daily orders</h4><p>Each day the steward gives one order, such as quarrying stone or slaying a Brute. Finish it by dawn for a reward.</p>

/* ---------- main loop ---------- */
let tutT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - (lastT || now)) / 1000); lastT = now;
  pollPad(dt);
  const running = state === 'play' && !menuOpen && !paused && !extPaused && !document.hidden;
  if (running) {

}
