<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hollow Kingdom</title>
<link rel="icon" href="data:,">
<style>
:root{
  --sky-top:#2C343B;--sky-bot:#14181C;--stone:#121214;--hills:#22272B;--moon:#DCD8CA;
  --gold:#D6A94A;--maroon:#5A1E2A;--violet:#6E5A8C;--ts:1;
  --panel:rgba(20,24,28,.92);--line:rgba(220,216,202,.14);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,"Times New Roman",serif;
}
html{font-size:calc(15px * var(--ts))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#14181C;color:var(--moon);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#c.drag{cursor:grabbing}
canvas#c.target{cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(44,52,59,.85);border-radius:.5rem;padding:.45rem .8rem;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){border-color:rgba(214,169,74,.6);background:rgba(60,64,66,.9)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:700}
button.primary:hover:not(:disabled){background:#e4b95a}
button.danger{border-color:rgba(160,60,75,.6)}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;padding:.55rem .7rem;pointer-events:none;background:linear-gradient(rgba(20,24,28,.85),rgba(20,24,28,0))}
#topbar > *{pointer-events:auto}
#res{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:center;max-width:44%}
.r{display:flex;align-items:center;gap:.3rem;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;padding:.15rem .1rem;border-radius:.4rem;transition:transform .15s,color .15s}
.r svg{width:1.2rem;height:1.2rem;flex:none}
.r.bump{transform:scale(1.25);color:#fff}
.r.short{color:#e07a6a}
.r small{font-weight:500;opacity:.6;font-size:.75rem}
#clock{display:flex;align-items:center;gap:.6rem;background:rgba(20,24,28,.7);border:1px solid var(--line);border-radius:2rem;padding:.25rem .6rem .25rem .3rem}
#dial{width:2.4rem;height:2.4rem}
#clockText b{display:block;font-family:var(--serif);font-size:1.05rem;letter-spacing:.02em}
#clockText span{font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#speed{display:flex;gap:.2rem}
#speed button{padding:.2rem .45rem;font-size:.8rem;border-radius:1rem;min-width:2rem}
#speed button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
#tr{display:flex;gap:.35rem}
#tr button{padding:.4rem .7rem}
#goal{position:absolute;top:3.6rem;left:.7rem;background:var(--panel);border:1px solid rgba(214,169,74,.35);border-radius:.6rem;padding:.5rem .7rem;min-width:13rem;max-width:17rem;cursor:pointer}
#goal h4{margin:0 0 .3rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:700}
#goal .gn{font-family:var(--serif);font-size:1.1rem;margin-bottom:.3rem}
.bar{height:.36rem;background:rgba(255,255,255,.08);border-radius:1rem;overflow:hidden;margin:.18rem 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:1rem;transition:width .3s}
.costrow{display:flex;align-items:center;gap:.4rem;font-size:.78rem;font-variant-numeric:tabular-nums}
.costrow svg{width:.95rem;height:.95rem;flex:none}
.costrow .bar{flex:1}
.costrow.ok{color:#cfd9b0}
#preview{position:absolute;top:3.6rem;right:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.45rem .7rem;font-size:.8rem;max-width:15rem}
#preview b{color:#b9a6d9}
#preview.blood{border-color:#8c2c3c}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:.6rem;pointer-events:none;background:linear-gradient(rgba(20,24,28,0),rgba(20,24,28,.8))}
#bottom > *{pointer-events:auto}
#jobs,#powers{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;align-items:stretch}
.job{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:5.6rem}
.job .jn{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8;display:flex;gap:.3rem;align-items:center}
.job .jn svg{width:.9rem;height:.9rem}
.job .jc{display:flex;align-items:center;gap:.35rem}
.job .jc b{font-size:1.15rem;min-width:1.4rem;text-align:center;font-variant-numeric:tabular-nums}
.job .jc button{padding:.1rem .5rem;font-weight:700;border-radius:.4rem}
.job.idle{justify-content:center;opacity:.85}
.job .side{display:flex;gap:.25rem;font-size:.72rem;align-items:center}
.job .side button{padding:0 .35rem;font-size:.75rem}
.pw{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.4rem .7rem;min-width:5.8rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;overflow:hidden}
.pw .k{position:absolute;top:.2rem;left:.35rem;font-size:.65rem;opacity:.5}
.pw .pn{font-family:var(--serif);font-size:1rem}
.pw .pc{font-size:.72rem;opacity:.8;display:flex;align-items:center;gap:.2rem}
.pw .pc svg{width:.8rem;height:.8rem}
.pw .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}
.pw.locked{opacity:.35}
.pw.armed{border-color:var(--gold);box-shadow:0 0 0 2px rgba(214,169,74,.4)}
#guardsBox{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.75rem;gap:.2rem}
#guardsBox .side{display:flex;gap:.3rem;align-items:center}
#guardsBox button{padding:0 .4rem}
#walls{display:flex;gap:.6rem;font-size:.7rem;opacity:.85}
#walls .bar{width:3.5rem}
#walls .bar i{background:#9aa3a8}

/* side panel */
#panel{position:absolute;right:.7rem;top:7.2rem;max-height:calc(100% - 15rem);width:21rem;max-width:calc(100% - 1.4rem);background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.9rem 1rem;overflow:auto;backdrop-filter:blur(4px)}
#panel h2{font-family:var(--serif);font-weight:400;margin:0 0 .2rem;font-size:1.5rem;color:#f0e6cc}
#panel .x{position:absolute;top:.5rem;right:.5rem;padding:.1rem .5rem}
#panel .st{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.6rem}
#panel .st.lit{color:var(--gold)}#panel .st.dark{opacity:.6}#panel .st.building{color:#c9a27a}
#panel p{margin:.4rem 0;font-size:.88rem;line-height:1.45}
#panel .lore{font-family:var(--serif);font-style:italic;color:#e8d9b0;border-left:2px solid var(--gold);padding-left:.6rem}
#panel .req{font-size:.8rem;opacity:.85}
#panel .req .no{color:#e07a6a}
#panel .btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.hl-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.4rem}
.hrow{display:flex;align-items:center;gap:.5rem;padding:.4rem .5rem;border:1px solid var(--line);border-radius:.5rem;cursor:pointer;background:rgba(255,255,255,.02)}
.hrow:hover{border-color:rgba(214,169,74,.5)}
.hrow .dot{width:.7rem;height:.7rem;border-radius:2px;background:#2a2b2e;flex:none;border:1px solid #444}
.hrow .dot.lit{background:var(--gold);box-shadow:0 0 6px var(--gold);border-color:var(--gold)}
.hrow .dot.building{background:#8a6a3a}
.hrow .nm{font-family:var(--serif);flex:1}
.hrow .dep{font-size:.7rem;opacity:.6}

#toasts{position:absolute;top:4.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;width:min(36rem,90%)}
.toast{background:rgba(20,24,28,.9);border:1px solid rgba(214,169,74,.4);border-radius:.6rem;padding:.55rem 1rem;font-size:.9rem;text-align:center;animation:tin .4s ease-out;transition:opacity .8s}
.toast.lore{font-family:var(--serif);font-style:italic;font-size:1rem;color:#f0e2bc}
.toast.bad{border-color:#8c2c3c}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:var(--serif);font-size:3rem;color:#f0e6cc;text-shadow:0 0 30px rgba(0,0,0,.8);opacity:0;transition:opacity 1s}
#banner small{display:block;font-size:1rem;font-family:var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:.4rem}
#banner.show{opacity:1}
#banner.blood{color:#e5a0a8}

#tip{position:fixed;z-index:30;max-width:17rem;background:#f2e6c4;color:#1b1408;border-radius:.6rem;padding:.65rem .8rem;font-size:.88rem;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:auto}
#tip b{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:.2rem}
#tip button{margin-top:.45rem;padding:.15rem .5rem;font-size:.72rem;background:transparent;color:#1b1408;border-color:rgba(0,0,0,.25)}
#tip:after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#f2e6c4;transform:translateX(-50%) rotate(45deg)}
#tip.below:after{top:-6px}#tip.above:after{bottom:-6px}
.hl{box-shadow:0 0 0 2px var(--gold),0 0 18px 4px rgba(214,169,74,.55)!important;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 8px 1px rgba(214,169,74,.3)}}

/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#title{justify-content:flex-end;padding-bottom:7vh;background:linear-gradient(rgba(20,24,28,0) 55%,rgba(17,18,20,.9) 80%)}
#title h1{font-family:var(--ui);font-weight:800;font-size:clamp(2.4rem,7vw,4.6rem);margin:0;color:#fff;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#title .tag{margin:.4rem 0 .2rem;font-size:1.05rem;color:#cfcac0}
#title .line{font-family:var(--serif);font-style:italic;color:var(--gold);margin:.3rem 0 1.3rem;font-size:1.05rem;opacity:.9}
#title .menu{display:flex;flex-direction:column;gap:.5rem;min-width:15rem}
#title .menu button{padding:.7rem 1rem;font-size:1rem}
#title .reign{font-size:.75rem;opacity:.6;margin-top:.8rem;letter-spacing:.1em;text-transform:uppercase}
#title .credit{position:absolute;bottom:.6rem;right:.8rem;font-size:.7rem;opacity:.4}
#modal{background:rgba(10,12,14,.55);backdrop-filter:blur(3px)}
.card{background:#181c20;border:1px solid var(--line);border-radius:1rem;padding:1.4rem 1.6rem;min-width:18rem;max-width:min(30rem,92vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h2{font-family:var(--serif);font-weight:400;font-size:1.8rem;margin:0 0 .3rem;color:#f0e6cc}
.card h3{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 .8rem}
.card .menu{display:flex;flex-direction:column;gap:.45rem;margin-top:1rem}
.card .menu button{padding:.6rem 1rem}
.card table{width:100%;border-collapse:collapse;font-size:.9rem;margin:.4rem 0}
.card td{padding:.32rem 0;border-bottom:1px solid var(--line)}
.card td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.card td.bad{color:#e07a6a}.card td.good{color:#cfd9b0}
.card.wide{max-width:min(42rem,94vw)}
.card p{font-size:.9rem;line-height:1.5;opacity:.9}
.klist{display:grid;gap:.5rem;margin-top:.6rem}
.kitem{text-align:left;display:block;width:100%;padding:.7rem .9rem;border-radius:.7rem;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.kitem:not(:disabled):hover,.kitem:not(:disabled):focus-visible{border-color:var(--gold)}
.kitem:disabled{opacity:.45}
.kitem b{font-family:var(--serif);font-weight:400;font-size:1.15rem;color:#f0e6cc}
.kitem .kc{float:right;letter-spacing:.1em;color:var(--gold)}
.kitem small{display:block;opacity:.75;font-size:.8rem;margin-top:.15rem;line-height:1.4}
.crowns{font-size:2rem;letter-spacing:.3rem;color:var(--gold);margin:.3rem 0}
.crowns .off{opacity:.25}
.kobj{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:-.1rem 0 .4rem;padding-bottom:.35rem;border-bottom:1px solid rgba(214,169,74,.2)}
.howto h4{margin:1.1rem 0 .4rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.howto table td{font-weight:400;text-align:left;vertical-align:top;padding-right:.6rem;font-size:.85rem}
.howto table td:first-child{white-space:nowrap;font-weight:700;color:#f0e6cc}
.howto ul{padding-left:1.1rem;margin:.3rem 0;font-size:.88rem;line-height:1.5}
.set{display:grid;grid-template-columns:7rem 1fr 2.5rem;align-items:center;gap:.5rem;margin:.45rem 0;font-size:.9rem}
.set input[type=range]{width:100%;accent-color:var(--gold)}
.seg{display:flex;gap:.3rem}
.seg button{padding:.25rem .6rem;font-size:.82rem}
.seg button.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
#cursor{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--gold);border-radius:50%;pointer-events:none;z-index:50;box-shadow:0 0 10px rgba(214,169,74,.6)}
#cursor:after{content:"";position:absolute;left:8px;top:8px;width:2px;height:2px;background:var(--gold)}
@media (max-width:720px){
  #res{max-width:58%;gap:.2rem .5rem}
  .r{font-size:.85rem}
  #clock{padding:.15rem .4rem .15rem .2rem;gap:.35rem}
  #dial{width:1.9rem;height:1.9rem}
  #speed button{min-width:1.6rem;padding:.15rem .3rem}
  #clockText span{display:none}
  #goal{top:auto;bottom:9.5rem;min-width:0;max-width:11rem;padding:.4rem .5rem}
  #goal .costrow span{display:none}
  #preview{display:none}
  #topbar{flex-wrap:wrap}
  #panel{top:auto;bottom:8.6rem;max-height:46vh;width:auto;left:.7rem}
  .job{min-width:4.2rem;padding:.25rem .3rem}
  .pw{min-width:4.4rem;padding:.3rem .4rem}
  #banner{font-size:2rem}
}
@media (max-width:420px){ #tr button{padding:.3rem .45rem} #clock{order:3} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="res"></div>
    <div id="clock">
      <svg id="dial" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="rgba(0,0,0,.35)" stroke="rgba(220,216,202,.2)" stroke-width="2"/><circle id="dialArc" cx="20" cy="20" r="17" fill="none" stroke="#D6A94A" stroke-width="3" stroke-dasharray="106.8" stroke-dashoffset="0" transform="rotate(-90 20 20)" stroke-linecap="round"/><g id="dialIcon"></g></svg>
      <div id="clockText"><b id="dayLabel">Day 1</b><span id="timeLeft">2:30</span></div>
      <div id="speed"><button data-s="0" title="Pause (Space)">II</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="3">3x</button></div>
    </div>
    <div id="tr"><button id="btnHalls" title="Halls (H)">Halls</button><button id="btnMenu" title="Menu (Esc)">&#9776;</button></div>
  </div>
  <div id="goal"></div>
  <div id="preview"></div>
  <div id="bottom"><div id="jobs"></div><div id="powers" class="hidden"></div></div>
  <div id="panel" class="hidden"></div>
  <div id="toasts"></div>
</div>
<div id="banner"></div>
<div id="tip" class="hidden"></div>

<div id="title" class="screen">
  <h1>Hollow Kingdom</h1>
  <div class="tag">Rebuild a kingdom one empty hall at a time.</div>
  <div class="line">The halls remember. Light them again.</div>
  <div class="menu">
    <button id="tContinue" class="primary hidden">Continue</button>
    <button id="tNew">Kingdoms</button>
    <button id="tHow">How to Play</button>
    <button id="tSettings">Settings</button>
  </div>
  <div class="reign" id="tReign"></div>
  <div class="credit">A PlayChain game by Steeve</div>
</div>
<div id="modal" class="screen hidden"><div class="card" id="mcard"></div></div>
<div id="cursor" class="hidden"></div>
<script>
'use strict';
/* =====================================================================
   CONTENT: every balance number, hall, enemy and lore line lives here.
   Tune freely. Costs: st=stone tb=timber gr=grain em=ember co=coin.
   ===================================================================== */
const CONTENT = {
  version: 1,
  timing: { dayLen: 150, nightLen: 90, bellAt: 30, duskWalkHome: 9, nightFade: 3 },
  start: { villagers: 5, res: { stone: 6, timber: 4, grain: 14, ember: 5, coin: 4 }, wallHp: 160 },
  economy: {
    gatherPerSec: { quarry: 0.34, wood: 0.34, fields: 0.16 },
    loadSize: 3,                     // units carried per floating number
    upkeepPerVillager: 1,            // grain per villager per day
    hungryWorkMult: 0.6,
    taxPerVillager: 1,             // coin per villager at dawn
    repairHpPerSec: 1.2,             // wall duty by day, per guard
    stonePerRepairHp: 1 / 6,
    dawnWallRegen: 0.2,
    walkSpeed: 120, buildRate: 1,
    sellswordCost: 6, sellswordMax: 3,
    trades: [ { give: 'grain', n: 10, get: 'coin', m: 4 }, { give: 'coin', n: 6, get: 'stone', m: 12 }, { give: 'coin', n: 6, get: 'timber', m: 12 }, { give: 'stone', n: 15, get: 'coin', m: 4 } ]
  },
  // Halls. slot = room rect in world units (y is negative upwards). deps = halls required.
  halls: [
    { id: 'great', name: 'Great Hall', slot: [-120, -130, 240, 130], cost: {}, work: 0, deps: [], villagers: 0, layer: 'lead',
      unlock: 'Villager housing and the heart of the castle. Unlocks Flare.',
      lore: 'Here the last king ate alone, and the fire went out because no one thought to feed it.' },
    { id: 'kitchen', name: 'Kitchen', slot: [-360, -130, 240, 130], cost: { st: 20, tb: 15 }, work: 12, deps: [], villagers: 1, layer: 'drum',
      unlock: 'Grain feeds 2 villagers per unit instead of 1.',
      lore: 'The cooks left first. A kingdom starves long before it falls.' },
    { id: 'granary', name: 'Granary', slot: [-520, -130, 160, 130], cost: { st: 30, tb: 30 }, work: 15, deps: ['kitchen'], villagers: 1, layer: 'lute',
      unlock: 'Fields yield 50% more grain.',
      lore: 'The grain was sold to pay for the walls. The walls did not need it.' },
    { id: 'forge', name: 'Forge', slot: [120, -130, 240, 130], cost: { st: 45, tb: 25, em: 3 }, work: 18, deps: ['kitchen'], villagers: 1, layer: 'anvil',
      unlock: 'Guards hit 50% harder. Unlocks Mend (repair a wall at night).',
      lore: "The smith refused to forge the king's last sword. He said steel cannot fix what silence broke." },
    { id: 'barracks', name: 'Barracks', slot: [360, -130, 160, 130], cost: { st: 45, tb: 40, gr: 10 }, work: 18, deps: ['kitchen'], villagers: 2, layer: 'brass',
      unlock: 'Guards train as archers and shoot from range. Unlocks Rally and sellswords.',
      lore: 'The guards were sent home one by one, until the gate had only a lock.' },
    { id: 'chapel', name: 'Chapel', slot: [-520, -390, 160, 130], cost: { st: 55, tb: 35, em: 6 }, work: 20, deps: ['granary'], villagers: 1, layer: 'choir',
      unlock: '+3 Ember every dawn. Unlocks Light (big area damage).',
      lore: 'The candles kept burning a week after the last prayer. Light outlasts the hands that lit it.' },
    { id: 'watchtower', name: 'Watchtower', slot: [360, -390, 160, 130], cost: { st: 65, tb: 50, co: 10 }, work: 22, deps: ['barracks'], villagers: 1, layer: 'stringsLow',
      unlock: "See the next night's Hollow in advance. Archer towers on both walls.",
      lore: 'From here they watched the Hollow gather for a year, and rang no bell.' },
    { id: 'market', name: 'Market', slot: [-360, -260, 360, 130], cost: { st: 50, tb: 60, gr: 20 }, work: 20, deps: ['granary'], villagers: 2, layer: 'flute',
      unlock: '+6 Coin every dawn and trading of resources.',
      lore: 'Trade stopped when coins grew heavier than promises.' },
    { id: 'library', name: 'Library', slot: [0, -260, 360, 130], cost: { st: 70, tb: 60, co: 20 }, work: 24, deps: ['market'], villagers: 1, layer: 'musicbox',
      unlock: 'Research: every job works 20% faster and builds go quicker.',
      lore: 'Every book here was a warning. The pages were burned for warmth.' },
    { id: 'infirmary', name: 'Infirmary', slot: [-520, -260, 160, 130], cost: { st: 60, tb: 50, gr: 30, em: 5 }, work: 22, deps: ['chapel'], villagers: 1, layer: 'stringsHigh',
      unlock: 'Fallen guards return the next day instead of dying.',
      lore: 'The Hollow were never invaders. They were the ones nobody came back for.' },
    { id: 'vault', name: 'Vault', slot: [360, -260, 160, 130], cost: { st: 90, tb: 60, co: 30 }, work: 24, deps: ['market'], villagers: 1, layer: 'bells',

const STEP = 1 / 30;

function rngNext(G) { // mulberry32 with state kept in save

  t = Math.imul(t ^ (t >>> 15), t | 1);

}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function newGame(reign, seed, kingdom) {

/* ---------- derived values ---------- */
const lit = (G, id) => G.halls[id] && G.halls[id].s === 'lit';
const litCount = G => CONTENT.halls.reduce((n, h) => n + (lit(G, h.id) ? 1 : 0), 0);
const bloodEvery = G => KM(G).bloodEvery || CONTENT.night.bloodEvery;
const isBlood = (n, G) => n % (G ? bloodEvery(G) : CONTENT.night.bloodEvery) === 0;
const restoredCount = G => litCount(G) - 1;
const jobCount = (G, j, side) => G.vill.reduce((n, v) => n + (v.job === j && !v.wounded && (side == null || v.side === side) ? 1 : 0), 0);

function canAfford(G, cost, frac) {
  frac = frac || 1;

  return true;
}

  const open = order.map(id => HALL[id]).filter(h => G.halls[h.id].s === 'dark' && depsMet(G, h));

}

  for (const k in h.cost) o[k] = Math.ceil(h.cost[k] * f);

}

/* ---------- actions (called from UI, also deterministic) ---------- */
function assign(G, job, delta, side) {
  if (delta > 0) {
    const v = G.vill.find(v => v.job === 'idle' && !v.wounded);
    if (!v) return false;
    v.job = job; v.acc = 0; if (side) v.side = side; v.hp = CONTENT.guards.hp;
    emit('assign', { job, x: v.x });

  } else {
    let cand = G.vill.filter(v => v.job === job && !v.wounded && (side == null || v.side === side));
    if (!cand.length) return false;
    const v = cand[cand.length - 1];

    emit('assign', { job: 'idle', x: v.x });
    return true;
  }
}
function moveGuard(G, from, to) {
  const v = G.vill.filter(v => v.job === 'wall' && !v.wounded && v.side === from).pop();
  if (!v) return false; v.side = to; emit('assign', { job: 'wall', x: v.x }); return true;
}

  if (G.building || !(st.s === 'dark' || st.s === 'damaged') || !depsMet(G, h)) return false;
  const cost = hallCost(G, h);

/* ---------- night planning (seeded, made at dawn so the Watchtower can preview) ---------- */
function planNight(G) {
  const N = CONTENT.night, n = G.day, blood = isBlood(n, G), km = KM(G);
  let budget = (N.baseBudget + N.perNight * (n - 1) + N.perHall * (litCount(G) - 1)) * (km.budget || 1);
  if (blood) budget *= N.bloodMult;
  const from = k => (km.from && km.from[k]) || CONTENT.hollow[k].from;
  const types = Object.keys(CONTENT.hollow).filter(k => k !== 'knight' && from(k) <= n);
  const wt = k => (km.weights && km.weights[k]) || 1, wsum = types.reduce((a, k) => a + wt(k), 0);
  const pickType = () => { let r = rngNext(G) * wsum; for (const k of types) { r -= wt(k); if (r <= 0) return k; } return types[types.length - 1]; };
  const sideFor = () => km.oneSide ? 1 : (rngNext(G) < 0.5 ? -1 : 1);
  const plan = [];
  N.waves.forEach((wtime, wi) => {
    let b = budget * N.waveShare[wi];
    let guard = 0;
    while (b > 0.5 && guard++ < 80) {
      const k = pickType();
      const c = CONTENT.hollow[k].cost;
      if (c > b + 0.6) { if (c <= 1) break; continue; }
      b -= c;
      const sd = sideFor();
      plan.push({ t: wtime + rngNext(G) * 9, k, side: n <= N.oneSideUntil ? 1 : sd, w: wi });
    }
    if (n === 1 && wi === 0 && !plan.length) plan.push({ t: wtime, k: 'wisp', side: 1, w: 0 });

}

/* ---------- transient night state ---------- */
let W = null; // world-transient: enemies, arrows, effects

function spawnEnemy(G, p) {

  if (p.k === 'knight') hp = d.hp + CONTENT.night.knightHpPerBlood * (Math.floor(G.day / bloodEvery(G)) - 1);
  const e = { id: W.eid++, k: p.k, side: p.side, x: p.side * CONTENT.night.spawnX, y: p.k === 'wisp' ? -28 : 0, hp, max: hp,

    if (e.loot) { G.res[e.loot.r] += e.loot.n; W.night.stolen[e.loot.r] = (W.night.stolen[e.loot.r] || 0) - e.loot.n; emit('recover', { x: e.x, y: e.y, r: e.loot.r, n: e.loot.n }); }

function guardsOn(G, side) { return G.vill.filter(v => v.job === 'wall' && !v.wounded && v.side === side && v.hp > 0 && v.onWall); }

function steal(G, e, n) {
  const pool = ['stone', 'timber', 'grain', 'coin'].filter(r => G.res[r] >= 1);
  if (!pool.length) return null;
  const r = pool[Math.floor(rngNext(G) * pool.length)];
  let take = Math.min(Math.floor(G.res[r]), Math.ceil(n * (lit(G, 'vault') ? 0.5 : 1)));

function stepNight(G, dt) {

  if (W.rally > 0) W.rally -= dt;
  // enemies

    } else if (e.st === 'climb') {
      e.t += dt; e.y = -Math.min(1, e.t / d.climb) * (-WALL_TOP); e.x = e.side * (WALL_FACE + 4);
      if (e.t >= d.climb) { e.st = 'onwall'; e.t = 0; e.x = e.side * (WALL_X + 30); e.y = WALL_TOP; }
    } else if (e.st === 'onwall') {
      e.t += dt;
      if (e.t >= d.rate) {

        if (gs.length) {
          let tg = gs[0], bd = 1e9; for (const g of gs) { const dd = Math.abs(g.x - e.x); if (dd < bd) { bd = dd; tg = g; } }

    g.cd -= dt; if (g.cd > 0) continue;

    let best = null, bd = 1e9;
    for (const e of W.en) {
      if (e.side !== g.side || e.hp <= 0 || e.st === 'gone' || e.st === 'dead') continue;
      if (e.st === 'inside' && Math.abs(e.x) < WALL_X - 120) continue;
      const dx = Math.abs(e.x - g.x), dd = dx + Math.abs(e.y - g.y) * 0.3;
      const range = archers ? gd.bowRange : gd.meleeRange + 40;

    }
    if (!best) continue;
    if (archers) {
      g.cd = gd.bowRate;
      const dist = Math.hypot(best.x - g.x, best.y - g.y);
      W.arrows.push({ x: g.x, y: g.y - 10, tx: best.x, ty: best.y - 12, t: 0, dur: Math.max(0.12, dist / 650), tgt: best.id, dmg: gd.bow * mult, kind: 'arrow' });

    } else {

      W['tcd' + sk] = (W['tcd' + sk] || 0) - dt;

      let best = null, bd = 1e9;

      if (best) {

}

function guardFalls(G, g) {

  if (g.sell) { G.vill = G.vill.filter(v => v !== g); return; }
  if (lit(G, 'infirmary')) { g.wounded = 1; W.night.wounded++; g.job = 'idle'; }
  else { G.vill = G.vill.filter(v => v !== g); W.night.lost++; }
}

function castPower(G, id, wx) {

  G.res.ember -= p.ember; W.cds[id] = p.cd;
  if (id === 'flare') {
    W.effects.push({ k: 'flare', x: wx, t: 0, dur: p.dur, r: p.radius });
    W.en.forEach(e => { if (Math.abs(e.x - wx) < p.radius && e.hp > 0) { e.slow = p.dur; e.reveal = p.dur; damageEnemy(G, e, p.dmg); } });
  } else if (id === 'light') {
    W.effects.push({ k: 'light', x: wx, t: 0, dur: 1.4, r: p.radius });
    W.en.forEach(e => { if (Math.abs(e.x - wx) < p.radius && e.hp > 0 && e.st !== 'gone') damageEnemy(G, e, p.dmg); });

    G.walls[k].hp = Math.min(G.walls[k].max, G.walls[k].hp + p.hp);

/* ---------- villagers (day + night movement) ---------- */

  const h = rooms[(v.id * 7) % rooms.length];
  const k = ((v.id * 53) % 100) / 100;
  return { x: h.slot[0] + 20 + k * (h.slot[2] - 40), y: roomFloor(h), room: h.id };

function stepVillagers(G, dt) {
  const E = CONTENT.economy, day = G.phase === 'day';
  const dusk = day && G.t > CONTENT.timing.dayLen - CONTENT.timing.duskWalkHome;
  const wm = workMult(G);

  G.vill.forEach((v, i) => {
    const tg = villagerTarget(G, v, i, dusk);
    v.anim += dt;
    if (v.thrust > 0) v.thrust -= dt;
    // wander inside a room when idle
    if (tg.room && Math.abs(v.x - tg.x) < 2 && v.y === tg.y) { v.wx = (v.wx || 0) + dt; }
    let tx = tg.x;

function finishHall(G, id) {
  const h = HALL[id], st = G.halls[id];
  const wasRepair = st.rep;
  st.s = 'lit'; st.p = 0; st.rep = false; G.building = null;
  G.vill.forEach(v => { if (v.job === 'build') v.job = 'build'; });
  if (!wasRepair) {
    for (let i = 0; i < h.villagers; i++) { const v = addVillager(G, 'gate'); v.x = 1450 + i * 40; }
    if (id === 'watchtower') { G.towers.L = CONTENT.tower.hp; G.towers.R = CONTENT.tower.hp; }
  }
  emit('hallLit', { id, repair: wasRepair });

/* ---------- dawn ---------- */
function doDawn(G) {
  const C = CONTENT, rep = Object.assign({}, W.night || { killed: 0, ember: 0, stolen: {}, lost: 0, wounded: 0, wallDmg: 0, darkened: [] });
  const survivedNight = G.day, km = KM(G);
  G.nightsSurvived++;
  if (!G.kst) G.kst = { breach: 0, lost: 0 };
  if (G.walls.L.hp <= 0 || G.walls.R.hp <= 0) { G.kst.breach++; rep.breached = true; }
  G.kst.lost += rep.lost || 0;
  if (rep.blood) { G.res.ember += C.rewards.bloodEmber; G.res.coin += C.rewards.bloodCoin; rep.bloodReward = true; }
  // remove sellswords, heal wounded (Infirmary), restore walls and towers
  G.vill = G.vill.filter(v => !v.sell);
  const healed = G.vill.filter(v => v.wounded).length;
  G.vill.forEach(v => { v.wounded = 0; v.hp = C.guards.hp; });
  const regen = km.wallRegen != null ? km.wallRegen : C.economy.dawnWallRegen;
  for (const sk of ['L', 'R']) { const w = G.walls[sk]; w.hp = Math.min(w.max, Math.max(w.hp, 0) + w.max * regen); }

  G.day++;
  G.phase = 'day'; G.t = 0;
  // upkeep
  const n = G.vill.length;
  const need = Math.ceil(n * C.economy.upkeepPerVillager * (km.upkeep || 1) / (lit(G, 'kitchen') ? 2 : 1));
  rep.eaten = Math.min(need, Math.floor(G.res.grain));
  G.hungry = G.res.grain < need;
  G.res.grain = Math.max(0, G.res.grain - need);
  const tax = Math.floor(n * C.economy.taxPerVillager);
  G.res.coin += tax; rep.tax = tax;
  G.res.ember += C.rewards.baseEmber + (km.emberDawn || 0);
  if (km.emberDawn) rep.ash = km.emberDawn;
  if (lit(G, 'chapel')) { G.res.ember += C.rewards.chapelEmber; rep.chapel = C.rewards.chapelEmber; }
  if (lit(G, 'market')) { G.res.coin += C.rewards.marketCoin; rep.market = C.rewards.marketCoin; }

/* Apply the player's choice for today's event. Returns a short result line. */
function chooseEvent(G, i) {

  o.vill = G.vill.map(v => ({ id: v.id, job: v.job, side: v.side, wounded: v.wounded || 0, sell: v.sell || 0, prev: v.prev || 0 }));

}

/* ---------- tutorial (first two days, one tip at a time) ---------- */
const TUT = [
  { id: 'quarry', title: 'Gather', text: 'Send a villager to the quarry. Stone restores halls.', el: () => $('j_quarry').querySelector('[data-d="1"]'), done: e => e === 'assign_quarry' },
  { id: 'wood', title: 'Gather', text: 'Now a woodcutter for timber. Idle hands earn nothing.', el: () => $('j_wood').querySelector('[data-d="1"]'), done: e => e === 'assign_wood' },
  { id: 'kitchen', title: 'Your next hall', text: 'When the bars fill, tap here (or the dark Kitchen) and press Restore.', el: () => $('goal'), done: e => e === 'restore_kitchen' || e === 'lit_kitchen', when: () => true },
  { id: 'guard', title: 'Night is coming', text: 'Put a guard on the walls. Guards fight the Hollow on their own.', el: () => $('j_wall').querySelector('[data-d="1"]'), done: e => e === 'assign_wall', when: () => G.phase === 'day' && (G.t > CONTENT.timing.dayLen - 50 || G.day > 1 || G.building === 'kitchen' || lit(G, 'kitchen')) },
  { id: 'flare', title: 'Cast a power', text: 'Tap Flare (or press 1), then tap near the Hollow to slow and reveal them.', el: () => $('p_flare'), done: e => e === 'cast', when: () => G.phase === 'night' && W.en.length > 0 }
];

  else { // pre-completion of later steps (e.g. player assigned a guard early)

}

  let s = TUT[G.tut];
  while (s && s.pre) { G.tut++; s = TUT[G.tut]; }
  if (!s) { hideTip(); return; }
  if (s.id === 'kitchen' && lit(G, 'kitchen')) { G.tut++; return tutUpdate(); }
  if (s.when && !s.when()) { hideTip(); return; }
  const el = s.el(); if (!el || el.offsetParent === null) { hideTip(); return; }
  if (tipEl !== el) { if (tipEl) tipEl.classList.remove('hl'); tipEl = el; el.classList.add('hl'); }
  const tip = $('tip');
  if (tip.dataset.k !== s.id) { tip.innerHTML = `<b>${s.title} &middot; ${G.tut + 1}/${TUT.length}</b>${s.text}<br><button id="tipSkip">Skip tutorial</button>`; tip.dataset.k = s.id; $('tipSkip').onclick = () => { G.tut = 99; hideTip(); save(); Audio.sfx('back'); }; }
  tip.classList.remove('hidden');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const below = r.top < VH / 2;
  let left = clamp(r.left + r.width / 2 - tw / 2, 8, VW - tw - 8);
  tip.style.left = left + 'px'; tip.style.top = (below ? r.bottom + 12 : r.top - th - 12) + 'px';
  tip.className = below ? 'below' : 'above'; tip.style.setProperty('--ax', clamp(r.left + r.width / 2 - left, 14, tw - 14) + 'px');
}

/* ---------- input: mouse, touch, keyboard, gamepad ---------- */
const ptrs = new Map(); let dragMoved = 0, pinch0 = null, downAt = null;
function hallAt(wx, wy) { for (const h of CONTENT.halls) { const s = h.slot; if (wx >= s[0] && wx <= s[0] + s[2] && wy >= s[1] && wy <= s[1] + s[3]) return h.id; } return null; }

function zoomAt(sx, sy, f) {
  const [wx, wy] = s2w(sx, sy); const nz = clamp(cam.tz * f, 0.32, 2.2);
  cam.tx = wx - (sx - VW / 2) / nz; cam.ty = wy - (sy - VH * 0.55) / nz; cam.tz = nz; cam.z = nz; cam.x = cam.tx; cam.y = cam.ty; clampCam();

cv.addEventListener('pointerdown', e => {

    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];

    if (dragMoved > 6) { cv.classList.add('drag'); cam.tx -= dx / cam.z; cam.ty -= dy / cam.z; cam.x = cam.tx; cam.y = cam.ty; clampCam(); }
  } else if (ptrs.size === 2 && pinch0) {

    const mx = (p[0][0] + p[1][0]) / 2, my = (p[0][1] + p[1][1]) / 2;

  if (state !== 'play') return;
  if (e.key === 'Escape') { e.preventDefault(); if (menuOpen) { if (modalKind !== 'report') { Audio.sfx('back'); closeModal(); } } else if (VIS.armed) { VIS.armed = null; cv.classList.remove('target'); } else if (!$('panel').classList.contains('hidden')) closePanel(); else openPause(); return; }

  else if (['1', '2', '3', '4'].includes(e.key)) { const p = CONTENT.powers.find(p => p.key === e.key); if (p) { if (p.target && G.phase === 'night') { const wx = nearestEnemyX(); if (VIS.armed === p.id || wx == null) pickPower(p.id); else { VIS.armed = p.id; castAt(wx); } } else pickPower(p.id); } }
  else if (e.key === 'h' || e.key === 'H') { $('panel').classList.contains('hidden') || panelKey.indexOf('list') !== 0 ? openHallsList() : closePanel(); }
  else if (e.key === 'p' || e.key === 'P') setSpeed(0);
  else if (e.key === 'ArrowLeft' || e.key === 'a') cam.tx -= 80 / cam.z;
  else if (e.key === 'ArrowRight' || e.key === 'd') cam.tx += 80 / cam.z;
  else if (e.key === 'ArrowUp' || e.key === 'w') cam.ty -= 60 / cam.z;
  else if (e.key === 'ArrowDown' || e.key === 's') cam.ty += 60 / cam.z;
  else if (e.key === '+' || e.key === '=') cam.tz *= 1.15;
  else if (e.key === '-') cam.tz /= 1.15;
  clampCam();
});
function nearestEnemyX() {
  // keyboard casting: target the densest group near a wall
  let best = null, bn = 0;
  for (const e of W.en) { if (e.hp <= 0 || e.st === 'gone') continue; let n = 0; for (const o of W.en) if (o.hp > 0 && Math.abs(o.x - e.x) < 140) n++; if (n > bn) { bn = n; best = e.x; } }
  return best;
}
// gamepad
let padActive = false, padPrev = {}, gcur = { x: 0, y: 0, on: false };
function pollPad(dt) {

  const ax = i => { const v = p.axes[i] || 0; return Math.abs(v) < 0.18 ? 0 : v; };
  if (p.buttons.some(x => x.pressed) || p.axes.some(v => Math.abs(v) > 0.3)) { if (!padActive) { padActive = true; gcur.x = VW / 2; gcur.y = VH / 2; } firstInput(); }
  const cur = $('cursor');
  if (state === 'title' || menuOpen) {

    const btns = [...document.querySelectorAll(state === 'title' && !menuOpen ? '#title button:not(.hidden)' : '#mcard button, #mcard input')];
    const idx = btns.indexOf(document.activeElement);
    const down = edge(13) || (ax(1) > 0.6 && !padPrev.ly), up = edge(12) || (ax(1) < -0.6 && !padPrev.ly);
    if (down) (btns[(idx + 1) % btns.length] || btns[0]).focus();
    if (up) (btns[(idx - 1 + btns.length) % btns.length] || btns[0]).focus();
    const a = document.activeElement;
    if (a && a.type === 'range' && (edge(14) || edge(15))) { a.value = clamp(+a.value + (edge(15) ? 0.1 : -0.1), 0, 1); a.dispatchEvent(new Event('input')); a.dispatchEvent(new Event('change')); }
    if (edge(0)) { if (a && a.tagName === 'BUTTON' && btns.includes(a)) a.click(); else if (btns[0]) btns[0].focus(); }
    if (edge(1) && menuOpen && modalKind !== 'report') { const bk = $('mBack') || $('mResume') || $('mNo'); if (bk) bk.click(); }
    if (edge(9) && menuOpen && modalKind === 'pause') $('mResume').click();

  } else if (state === 'play') {
    cur.classList.remove('hidden');
    gcur.x = clamp(gcur.x + ax(0) * 700 * dt, 0, VW); gcur.y = clamp(gcur.y + ax(1) * 700 * dt, 0, VH);
    cur.style.left = gcur.x + 'px'; cur.style.top = gcur.y + 'px';
    // edge-pan + right stick pan

    if (gcur.x < 30) cam.tx -= 500 * dt / cam.z; if (gcur.x > VW - 30) cam.tx += 500 * dt / cam.z;
    const lt = p.buttons[6] ? p.buttons[6].value : 0, rt = p.buttons[7] ? p.buttons[7].value : 0;
    if (lt > 0.1 || rt > 0.1) cam.tz *= Math.exp((rt - lt) * 1.4 * dt);
    clampCam();
    const [wx, wy] = s2w(gcur.x, gcur.y); VIS.hover = hallAt(wx, wy);
    if (edge(0)) { // A: click whatever is under the cursor
      const el = document.elementFromPoint(gcur.x, gcur.y);
      if (el && el !== cv && el.closest('button,.pw,.hrow,#goal')) el.closest('button,.pw,.hrow,#goal').click(); else tapAt(gcur.x, gcur.y);
    }
    if (edge(1)) { if (VIS.armed) { VIS.armed = null; cv.classList.remove('target'); } else closePanel(); Audio.sfx('back'); }
    if (edge(9)) openPause();
    if (edge(3)) openHallsList();
    if (edge(2)) { setSpeed(0); }
    if (edge(4)) setSpeed(Math.max(1, speed - 1)); if (edge(5)) setSpeed(Math.min(3, speed + 1));
    if (G.phase === 'night') { [12, 15, 13, 14].forEach((bi, i) => { if (edge(bi)) { const pw = CONTENT.powers[i]; if (pw.target) { VIS.armed = pw.id; castAt(s2w(gcur.x, gcur.y)[0]); } else pickPower(pw.id); } }); }
  }
  padPrev = {}; p.buttons.forEach((x, i) => padPrev[i] = x.pressed); padPrev.ly = Math.abs(ax(1)) > 0.6;
}
window.addEventListener('mousemove', () => { if (padActive) { padActive = false; $('cursor').classList.add('hidden'); } });

/* ---------- audio unlock / visibility ---------- */
let audioStarted = false;
function firstInput() { if (audioStarted) { if (Audio.ctx && Audio.ctx.state === 'suspended' && !document.hidden && !extPaused && !extMuted) Audio.suspend(false); return; } audioStarted = true; applySettings(); Audio.start(); applySettings(); if (state === 'play') { Audio.setMode(G.phase); syncLayers(); } else Audio.setMode('title'); }
document.addEventListener('visibilitychange', () => { Audio.suspend(document.hidden || extPaused || extMuted); if (document.hidden && state === 'play') save(); });
['pointerdown', 'touchstart'].forEach(t => window.addEventListener(t, firstInput, { passive: true }));

/* ---------- title + flow ---------- */
let saved = null;
function toTitle() {
  state = 'title'; VIS.titleMode = true; VIS.titleLit = ['great', 'throne', 'barracks'];
  cam.tz = cam.z = Math.min(VW / 1250, VH * 0.42 / 760); cam.tx = cam.x = 0; cam.ty = cam.y = (0.05 * VH) / cam.z - 20;
  $('hud').classList.add('hidden'); $('title').classList.remove('hidden'); hideTip();
  $('tContinue').classList.toggle('hidden', !(G || (saved && saved.game)));
  const g = G || (saved && saved.game);
  $('tReign').textContent = g ? `${(KINGDOM[g.kingdom] || KINGDOMS[0]).name} · Day ${g.day} · ${CONTENT.halls.filter(h => g.halls[h.id] && g.halls[h.id].s === 'lit').length} halls lit` : '';
  if (audioStarted) Audio.setMode('title');
  setTimeout(() => { const b = !$('tContinue').classList.contains('hidden') ? $('tContinue') : $('tNew'); if (padActive) b.focus(); }, 30);
}
function enterPlay() {
  state = 'play'; VIS.titleMode = false; applyLook(G);
  $('title').classList.add('hidden'); $('hud').classList.remove('hidden');
  resetTransient(G);
  if (G.phase === 'night') { G.phase = 'day'; G.t = CONTENT.timing.dayLen - 4; }
  cam.tz = clamp(Math.min(VW / 1150, (VH - 150) / 520), 0.36, 1.0); cam.tx = 0; cam.ty = -170 + (VW < 720 ? 40 : 0);
  Audio.setLayers(CONTENT.halls.filter(h => lit(G, h.id)).map(h => h.layer), true);
  if (audioStarted) { Audio.setMode('day'); syncLayers(); }
  updateHUD(true);
  if (G.day === 1 && G.t < 1) setTimeout(() => banner('Day 1', 'The halls remember'), 400);
  setTimeout(tutUpdate, 900);
  if (G.event && G.phase === 'day' && !menuOpen) setTimeout(() => { if (state === 'play' && !menuOpen && G.event) showEvent(); }, 700);
}
function startNew() { startKingdom('greywatch'); }
function startKingdom(id) {
  const reign = G ? (G.reign || 1) : 1;
  const seed = (Date.now() ^ 0x9E3779B9) >>> 0;  // seed chosen once, all game logic after this is seeded
  G = newGame(reign, seed, id);
  if (!settings.tutorial || id !== 'greywatch' || (campaign.crowns.greywatch || 0) > 0) G.tut = 99;
  VIS.hallFx = {}; save(); enterPlay();
  const K = KINGDOM[id];
  setTimeout(() => banner(K.name, K.place), 450);
  setTimeout(() => toast(`${K.twist} Goal: restore ${K.goal.halls} halls and survive ${K.goal.nights} nights.`, '', 7000), 3200);
}
/* ---------- kingdoms (campaign) ---------- */
let campaign = { crowns: {} };
const kUnlocked = i => i === 0 || (campaign.crowns[KINGDOMS[i - 1].id] || 0) > 0;
const crownStr = n => [0, 1, 2].map(i => i < n ? '\u265B' : '<span class="off">\u265B</span>').join('');
function openKingdoms(back) {
  const total = KINGDOMS.reduce((a, k) => a + (campaign.crowns[k.id] || 0), 0);
  openModal(`<h3>Campaign &middot; ${total} of ${KINGDOMS.length * 3} crowns</h3><h2>Kingdoms</h2><p>Each crown: restore the kingdom, keep every wall standing, and lose no villagers.</p><div class="klist">` +
    KINGDOMS.map((k, i) => { const ok = kUnlocked(i), c = campaign.crowns[k.id] || 0, cur = G && G.kingdom === k.id && !G.done;
      return `<button class="kitem" data-k="${k.id}" ${ok ? '' : 'disabled'}><span class="kc">${crownStr(c)}</span><b>${i + 1}. ${k.name}</b><small>${ok ? k.place + '. ' + k.twist : 'Restore ' + KINGDOMS[i - 1].name + ' to unlock.'}</small><small>${ok ? `Goal: ${k.goal.halls} halls, ${k.goal.nights} nights${cur ? ' &middot; <b style="font-size:.8rem;color:var(--gold)">in progress, day ' + G.day + '</b>' : ''}` : ''}</small></button>`; }).join('') +
    `</div><div class="menu"><button id="kBack">Back</button></div>`, 'kingdoms');
  $('mcard').classList.add('wide');
  $('mcard').querySelectorAll('.kitem').forEach(b => b.onclick = () => {
    const id = b.dataset.k; Audio.sfx('select');
    if (G && G.kingdom === id && !G.done) { closeModal(); if (state !== 'play') enterPlay(); return; }
    if (G && !G.done && G.nightsSurvived + restoredCount(G) > 0) confirmNew(() => openKingdoms(back), id); else { closeModal(); startKingdom(id); }
  });
  $('kBack').onclick = () => { Audio.sfx('back'); back ? back() : closeModal(); };
}
function afterReport() {
  const k = kingdomCheck(G);
  if (k) { showKingdomEnd(k); return; }
  if (G.event) showEvent();
}
function showKingdomEnd(kind) {
  const K = KINGDOM[G.kingdom] || KINGDOMS[0], i = KINGDOMS.indexOf(K), next = KINGDOMS[i + 1];

      <tr><td>Every wall held (${G.kst.breach} breach${G.kst.breach === 1 ? '' : 'es'})</td><td class="${G.kst.breach ? 'bad' : 'good'}">${G.kst.breach ? '-' : '\u265B'}</td></tr>
      <tr><td>No villager lost (${G.kst.lost} lost)</td><td class="${G.kst.lost ? 'bad' : 'good'}">${G.kst.lost ? '-' : '\u265B'}</td></tr></table>
      <p>${G.nightsSurvived} nights, ${restoredCount(G)} halls restored.${c > prev && prev ? ' New best!' : ''}</p>
      <div class="menu">${next ? `<button class="primary" id="kNext">Ride to ${next.name}</button>` : '<p style="color:var(--gold)">Every kingdom is restored. The Hollow have nowhere left to go.</p>'}<button id="kStay" ${next ? '' : 'class="primary"'}>Keep defending (Endless Nights)</button><button id="kList">Kingdoms</button>${inFrame ? '<button id="kVote">Back to PlayChain to vote</button>' : ''}</div>`, 'kend');

  } else {

function showEvent() {

    ev.choices.map((c, i) => { const ok = !c.ok || c.ok(G); return `<button data-i="${i}" ${i === 0 && ok ? 'class="primary"' : ''} ${ok ? '' : 'disabled title="You cannot afford this"'}>${c.label}</button>`; }).join('') + `</div>`, 'event');

/* ---------- how to play (built from CONTENT so numbers stay true) ---------- */
const BEAT = {
  wisp: 'Fast and frail. Any guard or tower cuts them down; Flare reveals and slows a swarm.',
  husk: 'Slow and tough, pounds the gate. Stack guards on that wall, restore the Forge, and finish groups with Light.',
  thief: 'Picks the gate lock, steals resources and runs. Kill it on the way out to get the loot back. The Vault halves theft.',
  climber: 'Scales the wall to fight your guards. Keep two or more guards per wall; the Infirmary saves the fallen.',
  wailer: 'Hangs back and halves your guards\u2019 damage nearby. Barracks archers outrange it; Light reaches it.',
  knight: 'Blood Moon boss. Huge health, smashes towers first. Save ember for Light and Rally, and Mend the wall it hits.'

function openHowTo(back) {
  const C = CONTENT, cost = h => Object.keys(h.cost).map(k => h.cost[k] + ' ' + CKEY[k]).join(', ') || 'free';
  const K = KINGDOMS.map(k => `<tr><td>${k.name}</td><td>${k.twist} Goal: ${k.goal.halls} halls, ${k.goal.nights} nights.</td></tr>`).join('');
  openModal(`<h3>Guide</h3><h2>How to play</h2><div class="howto">
    <p>Each kingdom is a castle gone dark. By <b>day</b>, send villagers to work and restore halls. By <b>night</b>, the Hollow attack your two walls. Restore enough halls and survive enough nights to win the kingdom.</p>
    <h4>Day and night</h4><ul><li>A day lasts ${C.timing.dayLen / 60 | 0}:${String(C.timing.dayLen % 60).padStart(2, '0')}. The bell rings ${C.timing.bellAt} seconds before dusk: put guards on the walls.</li><li>Nights last up to ${C.timing.nightLen} seconds, in ${C.night.waves.length} waves. A banner warns you before each wave and red markers show where Hollow are off screen.</li><li>Every ${C.night.bloodEvery}th night (sooner in Ashfall) a Blood Moon brings the Hollow Knight, and a big reward at dawn.</li><li>At dawn: walls mend a little, villagers eat grain, you collect taxes, and sometimes an event asks you to choose.</li></ul>
    <h4>Resources</h4><table>
    <tr><td>Stone</td><td>From the quarry. Restores halls; guards on the walls use it to repair by day.</td></tr>
    <tr><td>Timber</td><td>From the woodcutters. Restores halls.</td></tr>
    <tr><td>Grain</td><td>From the fields. Each villager eats ${C.economy.upkeepPerVillager} per dawn (half with the Kitchen). Short on grain: hungry villagers work at ${C.economy.hungryWorkMult * 100}% speed.</td></tr>
    <tr><td>Ember</td><td>Dropped by the Hollow, +${C.rewards.baseEmber} each dawn, more with the Chapel. Pays for powers and some halls.</td></tr>
    <tr><td>Coin</td><td>${C.economy.taxPerVillager} per villager each dawn, more with the Market. Hires sellswords and pays for late halls.</td></tr></table>
    <h4>Jobs</h4><table>
    <tr><td>Quarry, Woodcutter, Fields</td><td>Gather stone, timber and grain.</td></tr>
    <tr><td>Build</td><td>Works on the hall being restored. More builders, faster halls.</td></tr>
    <tr><td>Walls</td><td>Guards. They repair by day and fight at night. Use the left and right buttons to choose the wall.</td></tr></table>
    <h4>Halls</h4><table>${C.halls.map(h => `<tr><td>${h.name}</td><td>${h.unlock} <span style="opacity:.6">(${cost(h)}${h.deps.length && h.id !== 'throne' ? '; needs ' + h.deps.map(d => HALL[d].name).join(', ') : ''})</span></td></tr>`).join('')}</table>
    <h4>The Hollow and how to beat them</h4><table>${Object.keys(C.hollow).map(k => `<tr><td>${C.hollow[k].name}</td><td>${BEAT[k]}</td></tr>`).join('')}</table>
    <h4>Powers (at night, cost ember)</h4><table>${C.powers.map(p => `<tr><td>${p.key}. ${p.name}</td><td>${p.desc}. ${p.ember} ember, ${p.cd} s cooldown. Unlocked by the ${HALL[p.hall].name}.</td></tr>`).join('')}</table>
    <h4>Kingdoms and crowns</h4><p>Win a kingdom for one crown. Keep both walls standing every night for a second, and lose no villagers for a third. Winning unlocks the next kingdom.</p><table>${K}</table>
    <h4>Controls</h4><ul><li><b>Mouse / touch:</b> tap a hall to select it, drag to pan, wheel or pinch to zoom.</li><li><b>Keys:</b> Space pause, 1 to 4 cast powers then click the target, H halls, Esc menu.</li><li><b>Gamepad:</b> left stick moves the cursor, right stick pans, A select, B back, triggers zoom, bumpers change speed.</li></ul>
    </div><div class="menu"><button class="primary" id="hBack">Got it</button></div>`, 'howto');
  $('mcard').classList.add('wide');
  $('hBack').onclick = () => { Audio.sfx('back'); back ? back() : closeModal(); };
}
$('tHow').onclick = () => { firstInput(); Audio.sfx('select'); openHowTo(); };
$('tNew').onclick = () => { firstInput(); Audio.sfx('select'); if (!G && saved && saved.game) G = deserialize(saved.game); openKingdoms(); };
$('tContinue').onclick = () => { firstInput(); Audio.sfx('select'); if (!G && saved && saved.game) G = deserialize(saved.game); if (!G) { startNew(); return; } enterPlay(); };
$('tSettings').onclick = () => { firstInput(); Audio.sfx('select'); openSettings(); };

/* ---------- main loop ---------- */
let tutT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - (lastT || now)) / 1000); lastT = now;
  pollPad(dt);

  if (running) {
    let sp = speed;

    acc += dt * sp;

    while (acc >= STEP && n < 12) {
      acc -= STEP; n++;
      const r = simStep(G);
      if (r === 'dawn') { acc = 0; handleFX(); dawn(); break; }
    }
    if (n >= 12) acc = 0;
    handleFX();
    waveWatch();
    saveTimer += dt; if (saveTimer > 20) { saveTimer = 0; save(); }

  stepParticles(running ? dt * (W && W.slowmo > 0 && !VIS.reduce ? 0.3 : 1) : dt * 0.0);
  for (const k in VIS.hallFx) VIS.hallFx[k].t += dt;
  render(state === 'boot' ? null : G, dt);
  if (state === 'play') {
    updateHUD(false);
    tutT -= dt; if (tutT <= 0) { tutT = 0.25; tutUpdate(); }
    if (Math.floor(VIS.time * 2) !== Math.floor((VIS.time - dt) * 2)) syncLayers();
  }
}

/* ---------- boot ---------- */
window.addEventListener('resize', () => { resize(); if (state === 'title') toTitle(); });
resize(); buildHUD(); applySettings();
VIS.titleMode = true; VIS.titleLit = ['great', 'throne', 'barracks'];
toTitle(); state = 'title';
requestAnimationFrame(frame);
post({ type: 'playchain:ready' });
loadAll().then(d => {
  if (d && typeof d === 'object') {
    saved = d;
    if (d.settings) { Object.assign(settings, d.settings); applySettings(); }
    if (d.campaign && d.campaign.crowns) campaign = d.campaign;
    memSave = d;
  }
  if (state === 'title') toTitle();
});
// debug/test hook (harmless)
window.__hk = { get G() { return G; }, render, waveWatch, startKingdom, openKingdoms, openHowTo, showEvent, afterReport, get campaign() { return campaign; }, chooseEvent, kingdomCheck, get W() { return W; }, simStep, CONTENT, startNew, castPower, assign, startRestore, cam, VIS, setSpeed, score, finishHall };
