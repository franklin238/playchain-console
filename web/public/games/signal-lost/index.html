<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Signal Lost</title>
<style>
:root{
  --void:#101417;--panel:#1A2024;--dead:#2A3438;--teal:#5FC9C9;--dimteal:#3E7F84;--amber:#E3A857;--violet:#9B7FD1;--white:#F2F5F5;--maroon:#5A1E2A;
  --text:#dfe7e8;--muted:#7f9095;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--text);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#scan{position:fixed;inset:0;pointer-events:none;z-index:40;display:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.16) 2px 3px),
  radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
body.scan #scan{display:block}
.hide{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:.72em 1.1em;margin:.38em 0;border:1px solid var(--dead);border-radius:10px;background:rgba(26,32,36,.82);
  color:var(--text);font-weight:600;letter-spacing:.02em;text-align:left;transition:border-color .12s,background .12s,color .12s}
.btn:hover,.btn:focus-visible,.btn.focus{border-color:var(--teal);color:#fff;background:rgba(62,127,132,.22);outline:none}
.btn.primary{border-color:var(--dimteal);color:var(--teal)}
.btn:disabled{opacity:.4;cursor:default}
.btn small{float:right;color:var(--muted);font-family:var(--mono);font-weight:400}
/* title */
#title{position:fixed;left:0;right:0;bottom:0;top:52%;z-index:10;display:flex;flex-direction:column;align-items:center;padding:0 16px;
  background:linear-gradient(to bottom,rgba(11,14,16,0),rgba(11,14,16,.9) 16%,#0b0e10 40%)}
#title h1{margin:3vh 0 0;font-size:clamp(40px,7.4vw,76px);font-weight:800;letter-spacing:-.01em;color:#fff;line-height:1}
#title .tag{margin:.6em 0 0;color:#c9d2d4;font-size:clamp(14px,1.8vw,19px)}
#title .line{margin:.9em 0 0;font-family:var(--mono);color:var(--teal);font-size:13px;letter-spacing:.08em;min-height:1.3em}
#title .menu{margin-top:2vh;width:min(520px,92vw);display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#title .menu .btn{margin:.3em 0}
@media (max-width:520px){#title .menu{grid-template-columns:1fr}}
#title .credit{position:absolute;bottom:10px;right:16px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
#title .kick{position:absolute;bottom:10px;left:16px;font-family:var(--mono);font-size:11px;color:var(--dimteal);letter-spacing:.14em;font-weight:700}
/* hud */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .lv{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .lv b{color:var(--teal);font-weight:700;margin-right:.5em}
#hud .stats{margin:0 auto;display:flex;gap:14px;font-family:var(--mono);font-size:13px}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:52px}
.stat span{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.stat b{font-size:17px;color:var(--text)}
.stat b.ok{color:var(--teal)} .stat b.over{color:var(--amber)} .stat b.bad{color:#d07080}
.stat i{font-style:normal;color:var(--muted);font-size:12px}
.ib{width:40px;height:40px;border:1px solid var(--dead);border-radius:10px;background:rgba(26,32,36,.85);display:grid;place-items:center;position:relative;flex:none}
.ib:hover,.ib:focus-visible,.ib.focus{border-color:var(--teal);outline:none}
.ib svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35}
.ib .badge{position:absolute;top:-6px;right:-6px;background:var(--teal);color:#0b1214;font:700 10px/16px var(--mono);min-width:16px;height:16px;border-radius:8px;padding:0 4px}
.ib .badge.zero{background:var(--dead);color:var(--muted)}
#legend{position:fixed;right:14px;bottom:12px;z-index:9;display:flex;gap:10px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;pointer-events:none}
#legend div{display:flex;align-items:center;gap:5px}
#legend svg{width:26px;height:8px}
/* map panel */
#mapPanel{position:fixed;top:0;right:0;bottom:0;width:360px;z-index:10;padding:18px 18px 16px;background:linear-gradient(to right,rgba(16,20,23,.0),rgba(16,20,23,.92) 8%);
  display:flex;flex-direction:column;overflow:auto}
#mapPanel h2{margin:0;font-size:12px;letter-spacing:.2em;color:var(--muted);font-family:var(--mono);font-weight:700}
#mapPanel .tot{margin:.35em 0 1em;font-family:var(--mono);font-size:13px;color:var(--text)}
#mapPanel .tot b{color:var(--teal)}
#mapPanel h3{margin:.2em 0 .1em;font-size:22px;color:#fff}
#mapPanel .rule{margin:0 0 .8em;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
#mapPanel{overflow-y:auto}
.awards{display:grid;gap:8px;margin:8px 0 12px}
.award{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;border:1px solid var(--dead);border-radius:12px;padding:8px 10px}
.award.on{border-color:var(--dimteal);background:rgba(62,127,132,.12)}
.award svg{width:64px;height:64px}
.award b{display:block;color:#fff;font-size:15px}
.award .req{font-family:var(--mono);font-size:12px;color:var(--muted)}
.award .bar{height:5px;border-radius:3px;background:var(--dead);margin-top:5px;overflow:hidden}
.award .bar i{display:block;height:100%;background:var(--teal)}
.award:not(.on) svg{filter:grayscale(1);opacity:.45}
.newaward{display:flex;gap:12px;align-items:center;border:1px solid var(--amber);border-radius:12px;padding:8px 12px;margin:8px 0;background:rgba(227,168,87,.08)}
.newaward svg{width:56px;height:56px;flex:none}
.newaward small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--amber)}
.ceremony{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ceremony svg{width:44px;height:44px}
.lvb{border:1px solid var(--dead);border-radius:10px;background:rgba(26,32,36,.8);padding:8px 4px 6px;text-align:center;font-family:var(--mono);font-size:13px}
.lvb .s{display:block;font-size:11px;letter-spacing:.1em;color:var(--dead);margin-top:2px}
.lvb .s .on{color:var(--teal)}
.lvb.done{border-color:var(--dimteal)}
.lvb:hover,.lvb:focus-visible,.lvb.focus{border-color:var(--teal);outline:none;color:#fff}
.lvb:disabled{opacity:.35;cursor:default}
#mapPanel .row{display:flex;gap:8px} #mapPanel .row .btn{text-align:center}
@media (max-width:760px){
  #mapPanel{top:auto;left:0;width:auto;height:52%;background:linear-gradient(to bottom,rgba(16,20,23,0),rgba(16,20,23,.95) 6%);padding:14px 16px}
  #hud{flex-wrap:wrap;padding:8px 10px;gap:6px}
  #hud .lv{order:0;flex:1 1 40%}
  #hud .stats{order:2;flex:1 1 100%;justify-content:center;gap:10px}
  .ib{width:36px;height:36px}
  #legend{display:none}
}
/* modal */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,11,13,.66);padding:16px}
#modal .card{width:min(420px,100%);max-height:100%;overflow:auto;background:rgba(20,26,29,.97);border:1px solid var(--dead);border-radius:16px;padding:22px 22px 18px;box-shadow:0 0 0 1px rgba(95,201,201,.06),0 30px 80px rgba(0,0,0,.6)}
#modal h2{margin:0 0 .2em;font-size:13px;letter-spacing:.22em;color:var(--teal);font-family:var(--mono)}
#modal h3{margin:.1em 0 .6em;font-size:24px;color:#fff}
#modal p{color:#c3cdd0;line-height:1.5}
.stars{display:flex;justify-content:center;gap:14px;margin:12px 0 14px}
.star{width:46px;height:46px;opacity:0;transform:translateY(-26px) scale(.6)}
.star svg{width:100%;height:100%}
.star.drop{animation:drop .5s cubic-bezier(.3,1.6,.5,1) forwards}
.star.off svg path{fill:none;stroke:var(--dead)}
@keyframes drop{to{opacity:1;transform:none}}
body.rm .star.drop{animation:none;opacity:1;transform:none}
.res{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-family:var(--mono);font-size:14px;margin:6px 0 14px}
.res span{color:var(--muted)} .res .ok{color:var(--teal)} .res .over{color:var(--amber)}
.tx{font-family:var(--mono);font-size:13px;color:var(--teal);border-left:2px solid var(--dimteal);padding:6px 0 6px 12px;margin:10px 0 14px;min-height:3em;white-space:pre-wrap}
.tx small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;margin-bottom:4px}
.set{display:grid;grid-template-columns:1fr 160px;align-items:center;gap:10px 12px;margin:8px 0 14px;font-size:14px}
.set input[type=range]{width:100%;accent-color:var(--teal)}
.tog{justify-self:end;width:52px;height:28px;border-radius:14px;border:1px solid var(--dead);background:var(--panel);position:relative}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.tog.on{border-color:var(--dimteal)} .tog.on::after{left:27px;background:var(--teal)}
.tog:focus-visible,.tog.focus{outline:2px solid var(--teal)}
.keys{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.7}
.keys b{color:var(--text);font-weight:600}
.log{margin:6px 0 10px}
.log .tx.locked{color:var(--dead)}
#modal .card.wide{width:min(580px,100%)}
.howto h4{margin:1.1em 0 .4em;font-size:12px;letter-spacing:.18em;color:var(--teal);font-family:var(--mono)}
.howto p,.howto li{color:#c3cdd0;line-height:1.5;font-size:14px;margin:.3em 0}
.howto ul{padding-left:1.1em;margin:.3em 0}
.howto b{color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:.4em 0}
.tiles div{display:flex;gap:9px;align-items:center;font-size:13px;color:#c3cdd0;line-height:1.3}
.tiles canvas.ico{width:40px;height:40px;flex:none;border-radius:8px;background:rgba(26,32,36,.9)}
.ach{display:grid;gap:6px;margin:8px 0 12px}
.ach div{border:1px solid var(--dead);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.ach div b{display:block;color:var(--muted);font-size:14px}
.ach div.on{border-color:var(--dimteal);color:#c3cdd0}
.ach div.on b{color:var(--teal)}
#bPulse.live{border-color:var(--amber)}
.ib .badge.amber{background:var(--amber)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:35;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--teal);
  background:rgba(16,20,23,.92);border:1px solid var(--dimteal);border-radius:20px;padding:7px 14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--dimteal);letter-spacing:.2em;font-size:12px;z-index:50;background:var(--void)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="scan"></div>

<div id="title" class="hide">
  <h1>Signal Lost</h1>
  <p class="tag">Restore a dead network, one relay at a time.</p>
  <p class="line" id="tline"></p>
  <div class="menu" id="tmenu"></div>
  <div class="kick">PLAYCHAIN · PUZZLE</div>
  <div class="credit">BY STEEVE · @GAMERSTEEVE</div>
</div>

<div id="hud" class="hide">
  <button class="ib" id="bMap" aria-label="Pause menu"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <div class="lv" id="hudLv"></div>
  <div class="stats" id="hudStats"></div>
  <button class="ib" id="bUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="bRedo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ib" id="bReset" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button class="ib" id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintBadge">0</span></button>
  <button class="ib hide" id="bPulse" aria-label="Pulse: clear soft static for 5 seconds (P)"><svg viewBox="0 0 24 24"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg><span class="badge amber" id="pulseBadge">0</span></button>
</div>
<div id="legend" class="hide"></div>

<div id="mapPanel" class="hide"></div>
<div id="modal" class="hide"><div class="card" id="mcard"></div></div>
<div id="toast"></div>
<div id="boot">TUNING IN…</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(function () {
'use strict';
var SL = window.SL, LEVELS = window.SL_LEVELS;
var $ = function (id) { return document.getElementById(id); };
var COL = { void: '#101417', panel: '#1A2024', dead: '#2A3438', teal: '#5FC9C9', dimteal: '#3E7F84', amber: '#E3A857', violet: '#9B7FD1', white: '#F2F5F5', maroon: '#5A1E2A', idle: '#56666c' };
var FCOL = [COL.teal, COL.amber, COL.violet, COL.white];
var FRGB = [[95, 201, 201], [227, 168, 87], [155, 127, 209], [242, 245, 245]];
var FNAME = ['TEAL', 'AMBER', 'VIOLET', 'WHITE'];

var REGIONS = [
  { n: 1, name: 'The Outskirts', rule: 'Relays, rotation and strength. Every hop costs one.', icon: 'corner' },
  { n: 2, name: 'Junction Town', rule: 'T-splits. One signal in, two out.', icon: 'tee' },
  { n: 3, name: 'Static Fields', rule: 'Static blocks the way. Boosters restore full strength.', icon: 'booster' },
  { n: 4, name: 'Frequency Bay', rule: 'Tuners change the frequency. Some receivers are picky.', icon: 'tuner' },
  { n: 5, name: 'Overpass', rule: 'Bridges let two signals cross without mixing.', icon: 'bridge' },
  { n: 6, name: 'Spectrum Labs', rule: 'Mixers take two signals and send one out. Two colours make white.', icon: 'mixer' },
  { n: 7, name: 'Ghost Lines', rule: 'Decoy receivers must stay dark.', icon: 'decoy' },
  { n: 8, name: 'Orbit', rule: 'Satellite dishes. In one, out the other.', icon: 'dish' },
  { n: 9, name: 'The Last Tower', rule: 'Every rule at once. Somebody is waiting at the end.', icon: 'tower' }
];
/* t: decoded when a region is fully restored. h: a fragment decoded at half way. */
var TRANSMISSIONS = [
  { f: '88.1', h: 'Day three. The hum is gone from the wires.\nI counted the pylons twice. Nine still standing.', t: 'Relay post nine, still here. Power is out past the ridge.\nIf you can hear this, keep the tower lit.' },
  { f: '91.4', h: 'Somebody painted arrows on the junction boxes.\nOne way to the river, two ways home.', t: 'Junction crew left at dawn and took the batteries.\nThey left the music on so the next one would not feel alone.' },
  { f: '96.0', h: 'Do not stand in the static too long.\nIt hums back if you hum at it.', t: 'The static is not weather. It moves when you stop watching.\nBoosters are in the shed by the pylon.' },
  { f: '99.7', h: 'The harbour lights run amber now.\nThe hill answered in violet last night. I think.', t: 'Amber for the harbour, violet for the hill.\nTeal was always for home.' },
  { f: '102.3', h: 'Found the overpass maps under the bridge.\nEvery line drawn twice, like they were scared of losing one.', t: 'Two lines can cross without touching.\nTook me a year to learn that about people too.' },
  { f: '103.6', h: 'Lab notebook, page forty. Two colours in, one comes out brighter.\nNobody wrote down why.', t: 'Mixing was never about losing the colours.\nTeal and amber still live inside the white. Listen closely.' },
  { f: '104.9', h: 'A receiver lit up on its own tonight.\nNothing was sending. I unplugged it anyway.', t: 'Do not answer every voice out here.\nSome receivers are listening for the wrong reasons.' },
  { f: '107.5', h: 'The dishes turn when nobody is looking.\nOr I am turning, and they are still.', t: 'Dishes are up. If you are reading this, you found me.\nI am at the last tower. I never stopped transmitting.' },
  { f: '108.0', h: 'The last tower is louder than the others.\nIt is not music any more. It is a voice.', t: 'Every relay between us is lit.\nI can hear the whole network breathing. Stay on the line.' }
];
var FINAL_TX = { f: '108.9', t: 'This is the last tower. You found every relay, every dish, every lost colour.\nI kept transmitting because someone had to believe the signal would come back.\nIt did. It was you. The network is yours now. Keep it lit.' };
var ACH = [
  { id: 'first', name: 'First Light', d: 'Restore your first sector.' },
  { id: 'perfect', name: 'Perfect Lock', d: 'Earn 3 stars on a sector.' },
  { id: 'perfect10', name: 'Clean Hands', d: 'Earn 3 stars on 10 sectors.' },
  { id: 'half', name: 'Halfway Home', d: 'Restore 50 sectors.' },
  { id: 'stars150', name: 'Star Chart', d: 'Collect 150 stars.' },
  { id: 'mixer', name: 'White Light', d: 'Light a receiver with a mixed signal.' },
  { id: 'orbit', name: 'Uplink', d: 'Send a signal through a satellite pair.' },
  { id: 'ghost', name: 'Ghost Whisperer', d: 'Clear a decoy sector without ever lighting a decoy.' },
  { id: 'decoder', name: 'Decoder', d: 'Decode 5 full transmissions.' },
  { id: 'last', name: 'The Last Tower', d: 'Hear the final transmission.' },
  { id: 'daily', name: 'Daily Listener', d: 'Solve a Daily Signal.' },
  { id: 'storm5', name: 'Storm Chaser', d: 'Solve 5 puzzles in one Static Storm.' },
  { id: 'storm12', name: 'Eye of the Storm', d: 'Solve 12 puzzles in one Static Storm.' },
  { id: 'pulse', name: 'Through the Static', d: 'Finish a Storm puzzle while the static is pulsed open.' }
];
var byRegion = {}; LEVELS.forEach(function (l) { var r = +l.id.split('-')[0]; (byRegion[r] = byRegion[r] || []).push(l); });
var LEVEL_BY_ID = {}; LEVELS.forEach(function (l) { LEVEL_BY_ID[l.id] = l; });
var MAX_STARS = LEVELS.length * 3;

/* ------------------------------------------------------------------ save + bridge */
var inFrame = window.parent !== window;
function post(msg) { if (inFrame) try { window.parent.postMessage(msg, '*'); } catch (e) {} }
var prefersRM = false; try { prefersRM = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
var save = {
  v: 4, stars: {}, best: {}, hintsUsed: 0, hinted: {}, hintN: {}, unlocked: [1], decoded: [], daily: {}, lastRegion: 1,
  partial: [], ach: {}, storm: { best: 0, runs: 0 }, finalHeard: false,
  settings: { music: 0.8, amb: 0.55, sfx: 0.8, ui: 0.6, scan: true, reduce: prefersRM, patterns: true, text: 1 }
};
/* v1 saves had 7 regions. v2 inserts Spectrum Labs as region 6, so old 6 and 7 move up one. */
function migrateV1(d) {
  var re = function (id) { var p = String(id).split('-'); return p[0] === '6' ? '7-' + p[1] : p[0] === '7' ? '8-' + p[1] : id; };
  ['stars', 'best', 'hinted'].forEach(function (k) {
    if (!d[k] || typeof d[k] !== 'object') return;
    var o = {}; Object.keys(d[k]).forEach(function (id) { o[re(id)] = d[k][id]; }); d[k] = o;
  });
  var up = function (r) { return r === 6 || r === 7 ? r + 1 : r; };
  if (Array.isArray(d.decoded)) d.decoded = d.decoded.map(up);
  if (typeof d.lastRegion === 'number') d.lastRegion = up(d.lastRegion);
  d.v = 2;
  return d;
}
function mergeSave(d) {
  if (!d || typeof d !== 'object') return;
  if (!(d.v >= 2)) d = migrateV1(d);
  if (!(d.v >= 3)) {
    // v3 added 100 sectors; the old final sector 9-12 is now the last sector of region 9
    var fin = LEVELS[LEVELS.length - 1].id;
    ['stars', 'best', 'hinted'].forEach(function (k) { if (d[k] && d[k]['9-12'] != null) { d[k][fin] = d[k]['9-12']; delete d[k]['9-12']; } });
    d.v = 3;
  }
  if (!(d.v >= 4)) {
    // v4 added 70 master sectors; the final sector moved from 9-24 to the new last sector
    var fin4 = LEVELS[LEVELS.length - 1].id;
    if (d.v === 3) ['stars', 'best', 'hinted'].forEach(function (k) { if (d[k] && d[k]['9-24'] != null) { d[k][fin4] = d[k]['9-24']; delete d[k]['9-24']; } });
    d.v = 4;
  }
